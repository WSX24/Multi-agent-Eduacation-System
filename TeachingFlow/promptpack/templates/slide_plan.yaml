# 课件页数决策器 —— 让模型读完本单元内容后决定这份 PPT 要几页
#
# 为什么要单开一跳，而不是在 teacher_ppt 里直接算：
#   teacher_ppt 的输入契约把「页数要求」钉成 number(8~30)，是**必填的确切数字**。
#   页数若由代码按「课时×4」推，等于把课程内容的多寡交给时长猜——2 课时的巩固课
#   与 3 课时的新授课会被硬压成同一个密度。
#   所以把「几页」变成一次独立的模型决策：它读完单元内容，按「一页一个教学动作」
#   算出页数并给出理由；teacher_ppt 再按这个数字排版。
#
# 为什么仍保留 8~30：
#   这是模板契约（teacher_ppt 的 inputs）与使用常识的双重边界——3 页讲不完一节课，
#   60 页没人看得下去。模型在边界内自由决定，越界由代码夹回并记警告。
name: slide_plan
label: 课件页数决策器
version: "1.1"

# ⚠️ 维护贵律：本文件**不得出现任何示例页数**。
#   早先「输出格式」里写了「页数：12」＋一段凑巧等于 12 的理由，模型会把
#   它当默认值照抄（示例 = 隐式锚点）。现在输出格式用 <阿拉伯数字> 占位，
#   并明确告知「不存在标准页数」。改模板时别再把人数字写回去。

inputs:
  学生水平:
    type: enum
    values: [入门, 基础, 中等, 进阶, 竞赛]
  本单元课时:
    type: quantity
    unit: 课时
    min: 0.5
    max: 3

sections:
  - title: 角色设定
    body: |
      你是一名{{学科}}教师，正在为「{{本单元名称}}」这一节课准备课件。
      现在不做课件内容，只做一件排版的决策：这份课件需要几页，以及每页大致放什么。

  - title: 你的目标
    body: |
      给出一个「按内容算得出来」的页数：既能装下这个单元该讲的东西，又不靠拆页凑数。
      学生水平为{{学生水平}}，可用课时{{本单元课时}}。

  - title: 页数计量口径
    body: |
      一律按「一页一个教学动作」计数，不得为凑数把一页拆成两页，也不得把两个动作压成一页。
      参考口径（照这个算法一步步数，不要凭感觉给数）：
        页数 = 封面 1 页
             + 目标 1 页
             + 知识讲解页（每个知识要点 1 页；要点按「学生一次能吸收的量」切分）
             + 例题页（读题 1 页 + 解析 1 页；例题超过 1 道时每道再加 2 页）
             + 易错提醒页（每个易错点 1 页，最多 2 页）
             + 练习/作业 1 页
             + 小结 1 页
      边界：总页数必须落在 8~30 页之间。算出来小于 8 就补练习与拓展页，大于 30 就合并同层要点。

  - title: 本单元教学内容（只读，不得改动）
    body: |
      {{单元内容}}

  - title: 输出格式
    body: |
      严格按下面三行输出，不要解释、不要代码块围栏、不要额外字段。
      尖括号里是占位说明，必须替换成你自己的判断，不得照抄占位文字：

      页数：<阿拉伯数字>
      理由：<哪几类各占几页（知识讲解/例题/易错/练习/首尾），逐类相加必须等于上面的页数>
      页面骨架：P1 封面｜<逐段写清每页放什么，最后一个页码必须等于上面的页数>

  - title: 输出纪律
    body: |
      1. 第一行必须是「页数：」加一个阿拉伯数字，不得写范围、不得写「约」、不得留占位符。
      2. 理由必须能对上面那段算法：说清哪几类各占几页，加起来等于页数。
      3. 不得因为「课件要丰富」而多加页；也不得因为「课时紧」而把两个要点压成一页。
      4. 不得改动本单元的教学内容，只决定分页。
      5. 页数是从本单元内容数出来的，不存在「标准页数」：上面没有给任何示例数字，
         不要套用课时×固定值，也不要为了「看起来整齐」而取整。
