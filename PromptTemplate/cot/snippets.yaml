# 可复用 CoT（思维链）指令片段
# 直接拼接在任意角色模板之后使用。
#
# 分两组：
#   通用/理科   zero_shot / math_steps / self_check
#   文科       text_reading / source_analysis / essay_outline / self_check_humanities
#
# 为什么要专门做文科一组：原版 3 个片段里 2 个是数学专用（math_steps 自带
# 「数学符号规范」；self_check 要求「代入检验/特殊值检验」），文科调 cot=
# 实际只有通用一个选项可用。
name: cot_snippets
label: CoT 指令片段

# 零样本 CoT：通用、快速
zero_shot: |
  在回答之前，请先一步一步地思考推理过程，并把每一步的关键推理都写出来，最后再给出最终答案。

# 数学解题显式分步 CoT：数学计算、证明题
math_steps: |
  请严格按以下步骤展示解题过程：
  第 1 步【审题】提取已知条件和求解目标
  第 2 步【选方法】说明选择该解法/公式的理由
  第 3 步【计算】逐步写出计算过程，不得跳步
  第 4 步【检验】将结果代回原题验证
  第 5 步【结论】给出最终答案
  
  【数学符号规范】（必须遵守）
  - 禁止使用 LaTeX 标记：不得出现 \[ \] \( \) \times \div \frac \cdot 等反斜杠命令
  - 乘号写成 ×，除号写成 ÷
  - 分数写成 3/4 或 (a+b)/(c+d)
  - 幂写成 x² 、x³ 或 x^5
  - 每一步计算单独占一行，用 = 对齐，例如：
    a₃ = 1 + 2 × 3
       = 1 + 6
       = 7
# 带自我校验的 CoT：用于助教/答疑，提升正确率
self_check: |
  请完成解题后，再用“代入检验”或“特殊值检验”的方式自查一遍。
  如果发现错误，请修正后再输出最终答案。

# ────────────────── 以下为文科（语文/英语/历史/政治/地理）专用 ──────────────────

# 阅读理解类 CoT：语文现代文阅读、英语阅读、文言文理解
# 要点：一切结论必须能指回原文，禁止凭印象答题——文科最大的失分点
# 就是「答得挺好但没扣住原文」。
text_reading: |
  请严格按以下步骤完成阅读题的分析：
  第 1 步【定位】先明确题目问的是哪一处内容，用「」引用对应的原文句子或段落
  第 2 步【圈关键词】从题干里圈出限定词（如“作用”“含义”“为什么”“哪一处”），
      避免答非所问
  第 3 步【语境推断】结合上下文（前一句、后一句、段首段尾）说明这一处内容
      在文中的位置与承接关系
  第 4 步【依据回填】给出结论时，逐条附上支撑它的原文依据，格式为
      「结论 —— 依据：“……”（第 N 段）」
  第 5 步【检查取舍】确认每条结论都有原文支撑；若某条只有感觉、找不到依据，
      就删掉它，不要用“生动形象”“表达了作者感情”这类没有落点的空话凑字数

# 材料分析类 CoT：历史、政治、地理的材料/论述题
# 要点：材料题的分数来自「分点 + 有依据 + 回扣设问」，不是写得越多越好。
source_analysis: |
  请严格按以下步骤完成材料题的分析：
  第 1 步【读设问】先抄下设问的动词与限定范围（“概括”“分析”“评价”“结合材料”
      “结合所学”），这决定了答案要不要引用材料、要不要联系背景
  第 2 步【材料分层】把材料按句意切成 2-4 层，每层用一句话概括它在说什么
  第 3 步【提取信息】逐层提取可直接用于作答的信息点，引用材料时用「」标出，
      并注明来源（“据材料一”）
  第 4 步【联系背景】若设问要求“结合所学”，为每个信息点补上对应的时代背景或
      知识原理，并说明二者的对应关系
  第 5 步【分点作答】按点作答，每点先给结论、再给依据；点与点之间不重复、
      不交叉。最后用一句话回扣设问（回答了题目问的那个问题）

# 写作构思类 CoT：作文、议论文、论述题的谋篇布局
# 要点：先定立意与结构，再动笔；避免“想到哪写到哪”导致中途跑题。
essay_outline: |
  请严格按以下步骤完成写作构思：
  第 1 步【审题】标出题目的关键词与限定条件，用一句话写出“这道题要求我谈什么”，
      并写出一个反例（“如果只写……就跑题了”）
  第 2 步【定立意】给出中心论点或中心情感，用一句话表述，要求：
      可被论证、不空泛、不骑墙（不能“两方面都有道理”）
  第 3 步【列提纲】按“起—承—转—合”或“总—分—总”排出 3-5 个段落，
      每段写一句话的段落任务（这段要干什么），标出哪段是重点
  第 4 步【配素材】为每个分论点配 1 个具体素材（事例、细节、数据、引用），
      并说明它怎么证明该论点；找不到合适素材的分论点要换掉，
      不要用“古今中外有很多例子”充数
  第 5 步【写首尾】写出开头与结尾各 1-2 句，要求开头入题、结尾回扣中心

# 文科版自查 CoT：与 math_steps 的 self_check 互补（数学查“代入”，文科查“落点”）
self_check_humanities: |
  请完成作答后，用以下 4 条逐项自查一遍，发现问题就修正后再输出最终答案：
  1. 【回文检查】每一条结论是否都能指回具体的原文、材料或史实？指不回去的删掉
  2. 【回问检查】是否回答了题干问的那个问题（动词、范围、限定词都对得上）？
  3. 【落地检查】有没有“生动形象”“意义重大”“值得我们学习”这类没有落点的套话？
      有则替换成具体内容或删除
  4. 【体例检查】分点是否清楚、序号与格式是否与要求一致（如“结合材料”是否真的
      引了材料，“结合所学”是否真的联系了背景）
