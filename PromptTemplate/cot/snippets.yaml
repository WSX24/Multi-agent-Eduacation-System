# 可复用 CoT（思维链）指令片段
# 直接拼接在任意角色模板之后使用。
name: cot_snippets
label: CoT 指令片段

# 零样本 CoT：通用、快速
zero_shot: |
  在回答之前，请先一步一步地思考推理过程，并把每一步的关键推理都写出来，最后再给出最终答案。

# 数学解题显式分步 CoT：数学计算、证明题
math_steps: |
  请严格按以下步骤展示解题过程：
  第 1 步【审题】提取已知条件和求解目标
  第 2 步【选方法】说明选择该解法/公式的理由
  第 3 步【计算】逐步写出计算过程，不得跳步
  第 4 步【检验】将结果代回原题验证
  第 5 步【结论】给出最终答案
  
  【数学符号规范】（必须遵守）
  - 禁止使用 LaTeX 标记：不得出现 \[ \] \( \) \times \div \frac \cdot 等反斜杠命令
  - 乘号写成 ×，除号写成 ÷
  - 分数写成 3/4 或 (a+b)/(c+d)
  - 幂写成 x² 、x³ 或 x^5
  - 每一步计算单独占一行，用 = 对齐，例如：
    a₃ = 1 + 2 × 3
       = 1 + 6
       = 7
# 带自我校验的 CoT：用于助教/答疑，提升正确率
self_check: |
  请完成解题后，再用“代入检验”或“特殊值检验”的方式自查一遍。
  如果发现错误，请修正后再输出最终答案。
