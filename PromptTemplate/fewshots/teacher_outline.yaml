# 教师 Agent（作文构思）Few-shot 示例
#
# 为什么这两例必须存在：阶段 4A 此前借 teacher 渲染，锚的是 teacher 的范文
# （因式分解讲解、环境描写讲解）——范例体例就是**讲解体**，于是输出必然是
# 【本课目标】【知识讲解】…那一套，哪怕模板写的是别的要求。这份同名示例把体例锚死成：
#   【审题】(含反例) → 【立意】(中心句 + 支撑) → 【提纲】(第N段（作用）：…，一行一点) →
#   【素材】(素材N：…… —— 它证明：……) → 【首尾】(开头：/ 结尾：)
#
# 覆盖梯度：文理之外的第二种梯度——**文体**。
#   ① 记叙文：提纲用「起—承—转—合」，素材是动作细节（换手、弯腰晃一下）。
#   ② 议论文：提纲用「总—分—总」，素材是现象与对照（三分钟看完、抄作业）。
#   两个文体都必须示范，否则模型会把提纲一律写成起承转合。
#
# 两份示例的题目均为**自拟**（非真题），且刻意避开演示与评测用例的题目
# （「这也是课堂」/「小议『捷径』」），免得照抄检测把正常输出判成抄袭。
name: teacher_outline
label: 教师Agent·作文构思 Few-shot 示例
examples:
  - input: |
      学科：初中语文
      题目与要求：以「那一刻，我长大了」为题，写一篇不少于 600 字的记叙文
    output: |
      1. 【审题】题眼是「那一刻」——要写一个具体的瞬间，而不是一段时间的渐变；限定条件是记叙文，落点必须在「我」的转变上。
         反例：如果只写「我帮妈妈做了很多家务，妈妈夸我懂事了」，就跑题了——那是「那段时间」，没有「那一刻」。

      2. 【立意】中心句：长大不是学会做更多的事，而是第一次发现母亲也会累、也会需要人扶。
         支撑：用「我第一次替母亲提那袋米」这一个瞬间来支撑。

      3. 【提纲】
         第1段（起）：放学回家，我看见母亲在楼下停住脚步，把米袋换到另一只手上。
         第2段（承）：我想上前又不好意思，假装低头看手机，余光盯着她。
         第3段（转）：她弯腰时晃了一下，我一把接过米袋，她愣了一下，说我提不动。← 重点
         第4段（合）：上楼时我走在她身后，第一次觉得她比我矮，回扣中心句。

      4. 【素材】
         素材1：母亲把米袋从一只手换到另一只手、弯腰时晃了一下 —— 它证明：她确实累了，只是从不说。（用在第1段）
         素材2：她那句「你提不动」 —— 它证明：在她眼里我还没长大，而那一刻是我主动长大的开始。（用在第3段）

      5. 【首尾】
         开头：「那袋米很沉，沉到我第一次意识到，母亲每天提回来的不只是米。」
         结尾：「原来长大不是她能提动，而是我终于肯伸手。」

  - input: |
      学科：初中语文
      题目与要求：以「小议『快与慢』」为题，写一篇不少于 600 字的议论文
    output: |
      1. 【审题】题眼是「快」「慢」这对关系词，要先亮明立场再谈关系；限定条件是议论文，必须有可被反驳的论点。
         反例：如果只写「快有快的好处，慢有慢的好处，各有各的道理」，就跑题了——那是骑墙，没有论点。

      2. 【立意】中心句：真正的效率不是把每件事做得更快，而是把时间留给值得慢下来的事。
         支撑：用「读书」与「三分钟看完一部电影」这组对照来支撑。

      3. 【提纲】
         第1段（总）：由三分钟看完一部电影这种短视频现象引出论点。← 重点
         第2段（分）：论证一味求快会丢掉过程，用短视频代替阅读的例子。
         第3段（分）：论证该慢的地方慢下来才有产出，用先想清楚再动笔写作业为例。
         第4段（总）：回到论点，说明快慢的分界在于值不值得。

      4. 【素材】
         素材1：有人把「三分钟看完《西游记》」当成读过原著 —— 它证明：把过程压成结论，读者得不到体会。（用在第1段）
         素材2：同学抄答案五分钟写完、考试却写不对 —— 它证明：快而不懂是假效率，时间只是被挪了个位置。（用在第2段）

      5. 【首尾】
         开头：「当一部名著被压缩成三分钟，我们省下的是时间，丢掉的是过程。」
         结尾：「快与慢的答案不在速度，而在值不值得。」
