# 答疑 Agent Few-shot 示例
#
# 锚定四件事：
#   ① 【思路引导】只给突破口与提问，**不写出最终答案**（这是答疑最容易走形的地方，
#      模型一兴奋就把答案给完了，「引导」只剩标题）；
#   ② 【分层适配】必须写清本次用了哪种讲法、具体调整了什么；
#   ③ 【知识点链接】只用输入的知识点链，不自行增补；
#   ④ 【同类题】只出题、不附答案。
#
# 覆盖理科 1 例 + 文科 1 例：原版没有 qa 范文（答疑常年零样本），
# 且文科示例里不出现任何公式与数学符号，只用「」引用原文。
name: qa
label: 答疑Agent Few-shot 示例
examples:
  - input: |
      学科：初中数学
      学生水平：基础
      知识点链：有理数乘法法则 → 相反数 → 数轴
      学生提问：老师，为什么 (-2)×(-3) 等于 6？两个负数相乘，结果怎么会变成正的？
    output: |
      1. 【思路引导】先不急着背法则。我们把「负号」换成你能看见的动作：在数轴上，
         乘一个负数相当于朝相反方向「转身」一次。先自己想一想——
         连续转身两次，你最后朝向哪一边？把 (-2)×(-3) 里的两个负号分别看成两次转身，
         推一推再往下读。
      2. 【分步讲解】
         第一步：把符号和数字分开处理。(-2)×(-3) 先算数字部分 2×3 = 6，
         再单独决定结果前面是正号还是负号。
         第二步：用「相反数」理解符号。一个负号就是「取相反数」：
         -2 的相反数是 2，所以 (-2)×(-3) 也可以读成「把 -2 的相反数取 3 次」。
         第三步：用数轴验证。乘以 -1 相当于在数轴上关于 0 点翻折一次：
         3 翻折后到 -3，再翻折一次又回到 3。翻折两次等于没翻——
         这就是两个负号互相抵消的直观来源。
         第四步：回到法则本身。两数相乘，同号得正、异号得负，再把绝对值相乘；
         本题两个因数都是负数，属同号，所以结果为正。
      3. 【分层适配】本次按基础档讲：没有直接抛「同号得正」这个口诀，而是先用
         「转身 / 翻折」把符号讲通，再落到法则；四步拆开写，每步只做一件事。
         若你是进阶档，会直接给出法则，并让你自己论证「乘以 -1 等价于数轴翻折」。
      4. 【同类题】算一算：(-4)×(-5) 和 (-4)×5 分别是多少？做完想一想，
         两者的差别只出在哪一步？
      5. 【知识点链接】本题的知识点链是：有理数乘法法则 → 相反数 → 数轴。
         链上最关键的一站是「相反数」：它把看不见的「负号」翻译成了可以操作的动作。

  # 文科示例：不出现公式与数学符号，结论必须指回原文。
  # 注意它的【思路引导】同样不给结论——只给出「先看前后词性」这个突破口。
  - input: |
      学科：初中语文
      学生水平：中等
      知识点链：文言虚词「之」 → 语境推断 → 词性判断
      学生提问：老师，「之」一会儿是「的」，一会儿又像动词，我每次都是凭感觉选，有没有判断的办法？
    output: |
      1. 【思路引导】先别看整句话的意思，只做一件很小的事：把「之」字**前后的词**
         各自找出来。想一想：「之」前面如果是动作（比如「爱」「攻」），
         它后面还能接「的」吗？带着这个疑问，先看这两个短语再往下读：
         「爱莲之出淤泥」「辍耕之垄上」。
      2. 【分步讲解】
         第一步：定位置。「之」夹在两个成分之间时，才可能是结构助词；
         如果它后面跟的是一个动作，那基本就不是「的」。
         第二步：看前一个词的词性。以「爱莲之出淤泥而不染」为例：「爱」是动作，
         「之」在这里把「莲出淤泥」整件事拧成一个整体，用来作「爱」的对象；
         这时它是助词，作用是让一个句子不再独立成句。
         第三步：看后面是不是地点或名词。以「辍耕之垄上」为例：
         前面「辍耕」是动作，后面「垄上」是地方，动作后面直接跟地方，
         说明这里的「之」是表示「到、往」的动词。
         第四步：把判断顺序固定下来——先看前后词性，再看它把句子连成了什么结构，
         最后才落到译法。「的」只是其中一种可能，不是碰到就选的默认答案。
      3. 【分层适配】本次按中等档讲：给了三条可直接套用的判断依据（位置、前词性、后成分），
         每一条都配了一处课文原句作参照。
         若你是基础档，会先只讲最常见的两种（作「的」和作「到、往」），其余暂不展开；
         若你是进阶档，会补充它作宾语前置标志的用法（如「何陋之有」）。
      4. 【同类题】判断下面两处「之」的用法是否相同，并说出你的依据：
         ① 「予独爱莲之出淤泥而不染」　② 「水陆草木之花」。
      5. 【知识点链接】本题的知识点链是：文言虚词「之」 → 语境推断 → 词性判断。
         三者的关系是：它的用法随语境变，所以必须先定词性，而词性由前后成分决定。
