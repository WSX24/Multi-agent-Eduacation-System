# 教师 Agent（材料题示范作答）Few-shot 示例
#
# 为什么这两例必须存在：阶段 3B 此前借的是 teacher 的 Few-shot（因式分解、环境描写），
# 那两份范例的体例就是**讲解体**（1.【本课目标】2.【知识讲解】…）。模型照着范例走，
# 于是不管模板怎么写，输出都会往教学模块上靠。这份同名示例把体例锚死成「结论 + 依据」。
#
# 覆盖梯度：文理各一例（本角色两条轨道都用，见 COT_TABLE 的 (science|humanities, material)）。
#   ① 文科例（地理）：锚定「结合所学」这一支——每条依据除了材料数据，还要补上对应的原理/背景。
#   ② 理科例（生物实验）：锚定「根据材料」这一支——**不需要**联系背景，
#      说明第 4 步「联系背景」不是无条件的；这正是 9-30 真跑里模型自己做出的取舍。
#
# 两份示例的材料均为**自拟**（非真实史料/实验记录），只用于演示作答体例；
# 且刻意避开演示场景里用到的材料（语文《爱莲说》、物理浮力），免得照抄检测把正常输出判成抄袭。
name: teacher_material
label: 教师Agent·材料题示范作答 Few-shot 示例
examples:
  - input: |
      学科：初中地理
      材料：某县近十年统计——县城常住人口由 18 万增至 26 万；同期该县高中毕业生
      外出务工人数由每年 3000 人降至 1200 人；县城新建产业园 3 个，其中 2 个为农产品加工。
      设问：结合材料与所学，分析该县常住人口增长的原因。
    output: |
      1. 【审题】设问动词是「分析」，限定范围是「结合材料与所学」，因此每一条依据都要既引用材料里的数据、又补上对应的地理原理。

      2. 【作答】
         ① 结论：本地就业岗位增加，人口外流减少。
            依据：据材料「新建产业园 3 个，其中 2 个为农产品加工」，产业园提供就业岗位，对应「产业集聚带动就业」；同期「外出务工人数由 3000 人降至 1200 人」印证了外流减少。
         ② 结论：农产品加工业发展，使本地农业剩余劳动力就地转化。
            依据：据材料「2 个为农产品加工」，依托本地农产品延长产业链，原先要外出的劳动力得以在本地就业。
         ③ 结论：就业与人口回流又带动了县城服务、住房需求，进一步吸引人口迁入。
            依据：据材料「常住人口由 18 万增至 26 万」，这是人口机械增长的结果，对应「产业—就业—人口」的连锁反应。

      3. 【回扣设问】该县人口增长是「产业园兴起 → 岗位增加 → 外出务工减少、人口回流」共同作用的结果，属于产业带动型的人口机械增长。

  - input: |
      学科：初中生物
      材料：某小组探究「温度对唾液淀粉酶活性的影响」：取 4 支试管各加入等量淀粉溶液与
      唾液，分别置于 0℃、37℃、60℃、100℃ 水浴中，10 分钟后滴加碘液检测，蓝色深浅
      依次为：深蓝、不变蓝、浅蓝、深蓝。
      设问：根据材料，说明温度与该酶活性的关系，并说明理由。
    output: |
      1. 【审题】设问动词是「说明……并说明理由」，限定范围是「根据材料」，因此不需要引入课外背景，直接引用实验数据即可。

      2. 【作答】
         ① 结论：在 0~37℃ 范围内，温度升高，该酶活性增强。
            依据：据材料「蓝色深浅依次为：深蓝、不变蓝、浅蓝、深蓝」——第 1 管（0℃）深蓝、第 2 管（37℃）不变蓝；淀粉剩余越少说明被分解得越彻底，37℃ 时淀粉已基本分解完。
         ② 结论：超过 37℃ 后酶活性下降，100℃ 时几乎失活。
            依据：据材料「蓝色深浅依次为：深蓝、不变蓝、浅蓝、深蓝」中第 3 管（60℃）浅蓝、第 4 管（100℃）深蓝，温度过高使酶的结构被破坏，催化能力丧失。
         ③ 结论：该酶的最适温度约为 37℃。
            依据：据材料 37℃ 一管的检测结果「不变蓝」，四组中只有这一组的淀粉被完全分解，反应最快。

      3. 【回扣设问】温度通过影响酶的活性起作用：在最适温度（约 37℃）以下随温度升高而增强，超过最适温度后迅速减弱，高温会使酶失活。
