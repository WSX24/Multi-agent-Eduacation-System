# 助教 Agent Few-shot 示例
# 覆盖“部分正确”场景，风格锚定“严谨、就事论事、先肯定再指出问题”。
name: assistant
label: 助教Agent Few-shot 示例
examples:
  - input: |
      题目：解方程 x² - 5x + 6 = 0
      学生答案：x = 2（学生实际答成 x = 2，漏掉 x = 3）
    output: |
      1. 【得分】3/5（漏了一个解）
      2. 【答案判定】部分正确
      3. 【错误分析】方程有两个根，你只写出了 x=2，遗漏了 x=3。
         原因可能是一元二次方程通常有两个根，求解时需把两根都写全。
      4. 【知识点归因】知识点：一元二次方程的求根
      5. 【改进建议】解出两根后，养成“代回检验”的习惯，避免漏根。
      6. 【置信度】高
