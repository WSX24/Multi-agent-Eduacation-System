# 助教 Agent Few-shot 示例
# 覆盖“部分正确”场景，风格锚定“严谨、就事论事、先肯定再指出问题”。
#
# ⚠️ 示例输入里不得出现任何「答案提示」。旧版把「（学生实际答成 x = 2，漏掉 x = 3）」
#    写进了 input——那是给评测者看的注释，真实调用时 {{学生答案}} 只会是「x = 2」。
#    它等于在示例里泄题：模型不需判断就能把提示抄进输出，
#    同时被教会「去输入里找括号提示」——而这正是拄袭行为的温床。
name: assistant
label: 助教Agent Few-shot 示例
examples:
  - input: |
      题目：解方程 x² - 5x + 6 = 0
      学生答案：x = 2
      参考答案：x₁ = 2，x₂ = 3
      本题满分：5
    output: |
      1. 【得分】3/5
      2. 【答案判定】部分正确
      3. 【错误分析】你能正确解出 x = 2，因式分解这一步是对的。
         问题在于只写出了一个根：一元二次方程通常有两个根，两都要写全，漏掉 x = 3 要扣分。
      4. 【知识点归因】一元二次方程的求根
      5. 【改进建议】解出两根后，养成“代回检验”的习惯，避免漏根。
      6. 【置信度】高
