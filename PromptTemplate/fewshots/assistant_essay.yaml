# 助教 Agent（作文/主观题）Few-shot 示例
# 锚定三件事：
#   ① 每条评价都引用学生原文（用「」），不出现无落点的评语；
#   ② 维度名与各维满分与输入完全一致，各项得分之和等于总分；
#   ③ 只给一小段示范改写（≤50 字），不代写全文。
name: assistant_essay
label: 助教Agent·作文批改 Few-shot 示例
examples:
  - input: |
      学科：初中语文
      题目与要求：以「慢下来」为题，写一篇不少于 600 字的议论文
      学生本次作文/作答：
      现在的生活节奏越来越快，大家都在赶时间。我觉得我们应该慢下来。
      慢下来有很多好处。第一，慢下来可以让我们看清身边的风景。第二，慢下来可以让心情变好。第三，慢下来还可以让我们把事情想清楚。
      有些人太着急了，结果什么都做不好。就像有的人吃饭很快，结果吃坏了胃。所以我们要慢下来，不要着急。
      总之，慢下来是很好的，我们要学会慢下来。
      题目要求字数：不少于 600 字
      评分维度与各自满分：立意与思想 10、结构与条理 10、语言与表达 10、素材与论证 10
      总分：40
    output: |
      1. 【总分】24/40
      2. 【维度得分】
         立意与思想 6/10 —— 中心明确，全文都在谈「慢下来的好处」，但没有回答“为什么现在需要慢下来”，
         停留在好处的罗列上，思辨层次较浅。
         结构与条理 6/10 —— 有「第一、第二、第三」的并列结构，但四个自然段之间没有递进，
         开头与结尾几乎是同一句话的重复。
         语言与表达 7/10 —— 表达通顺，口语化但不出错，「看清身边的风景」这一句有画面感。
         素材与论证 5/10 —— 举例只有「有的人吃饭很快，结果吃坏了胃」一处，且是泛例，
         没有具体的人、事、时地，论证力弱。
      3. 【等级】三类文（60%，落在 55%~70% 区间）
      4. 【亮点】开头「现在的生活节奏越来越快，大家都在赶时间」一句抓住了读者的处境，
         把题目的现实针对性点了出来，这个切入角度是站得住的；「慢下来可以让我们看清身边的风景」
         一句写出了具体的感受，不是空喊口号。
      5. 【逐条问题】
         ① 立意未深挖 —— 依据：「总之，慢下来是很好的，我们要学会慢下来」，全文结论与开头
         表述几乎一致，没有推进到“快”与“慢”的关系这一层。
         ② 素材单薄 —— 依据：「就像有的人吃饭很快，结果吃坏了胃」，以泛例代替实例，
         整篇没有出现一个具体可考的人或事。
         ③ 论证方式单一 —— 依据：「慢下来有很多好处」后接三个并列句，只有列举、没有分析，
         没有回应“如果不慢下来会怎样”。
         ④ 字数未达标 —— 依据：全文约 180 字，题目要求不少于 600 字，仅为要求的三成。
      6. 【改进建议】把「好处罗列」改成「答一个问题」：围绕“我们为什么会失去慢的能力”展开，
         用一件具体的事（谁、什么时候、因为什么赶、结果如何）代替泛例。
         示范改写（针对②）：去年期末前，我连着三天在食堂站着扒完晚饭，只为省下二十分钟背书。
      7. 【置信度】高
