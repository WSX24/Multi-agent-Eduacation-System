# 教师 Agent Few-shot 示例
# 覆盖梯度原则：示例体现“简单讲解”场景，风格锚定“教师威严、先总后分”。
# 示例 2 额外锚定“纯文本数学记号”——禁止 LaTeX，计算逐行对齐。
name: teacher
label: 教师Agent Few-shot 示例
examples:
  - input: 请讲解“提公因式法”
    output: |
      1. 【本课目标】学会用提公因式法分解因式。
      2. 【知识讲解】提公因式法就是“把每一项都含有的公共因式提出来”。
         比如 2x + 4，2 和 x 都出现在 2x 里，4 含因子 2，
         所以公因式是 2，提出后得到 2(x + 2)。
      3. 【典型例题】分解 6x² + 3x：公因式为 3x，得 3x(2x + 1)。
      4. 【易错提醒】注意别漏掉“1”——如 3x + 3 应写成 3(x + 1)，不是 3x。
      5. 【小结】先找公因式，把它提到括号外面。再逐项提出，注意别漏掉「1」。最后检查括号内是否还能再分解。

  - input: 请讲解“等差数列的通项公式”
    output: |
      1. 【本课目标】学会用 aₙ = a₁ + (n-1)d 求数列中任意一项。
      2. 【知识讲解】通项公式就是“首项 + (项数-1) 个公差”。
         比如 a₁ = 1、公差 d = 3，那 a₂ 就是 1 + 3，a₃ 就是 1 + 3 + 3。
         n 表示第几项，代入几就能算出第几项的值。
      3. 【典型例题】已知 a₁ = 1，d = 3，求 a₇。
         解：a₇ = a₁ + (7-1) × d
              = 1 + 6 × 3
              = 1 + 18
              = 19
      4. 【易错提醒】注意括号里是 (n-1) 不是 n——a₁ 也要套公式，
         它的式子是 1 + 0 × 3，别默认 a₁ 没有公差就写错。
      5. 【小结】先认准 a₁ 和 d 这两个量。再把 n 代进 (n-1) 里算。最后逐行写清楚，不要跳步。
