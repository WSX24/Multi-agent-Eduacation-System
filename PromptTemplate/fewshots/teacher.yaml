# 教师 Agent Few-shot 示例
# 覆盖梯度原则：示例体现“简单讲解”场景，风格锚定“教师威严、先总后分”。
# 示例 2 额外锚定“纯文本数学记号”——禁止 LaTeX，计算逐行对齐。
# 示例 3 锚定**文科风格**——结论必须回扣原文/具体表述，不出现公式与数学符号，
#        避免整份范文集把模型带向理科话术（原版 5 份示例全是数理，文科零覆盖）。
name: teacher
label: 教师Agent Few-shot 示例
examples:
  - input: 请讲解“提公因式法”
    output: |
      1. 【本课目标】学会用提公因式法分解因式。
      2. 【知识讲解】提公因式法就是“把每一项都含有的公共因式提出来”。
         比如 2x + 4，2 和 x 都出现在 2x 里，4 含因子 2，
         所以公因式是 2，提出后得到 2(x + 2)。
      3. 【典型例题】分解 6x² + 3x：公因式为 3x，得 3x(2x + 1)。
      4. 【易错提醒】注意别漏掉“1”——如 3x + 3 应写成 3(x + 1)，不是 3x。
      5. 【小结】先找公因式，把它提到括号外面。再逐项提出，注意别漏掉「1」。最后检查括号内是否还能再分解。

  - input: 请讲解“等差数列的通项公式”
    output: |
      1. 【本课目标】学会用 aₙ = a₁ + (n-1)d 求数列中任意一项。
      2. 【知识讲解】通项公式就是“首项 + (项数-1) 个公差”。
         比如 a₁ = 1、公差 d = 3，那 a₂ 就是 1 + 3，a₃ 就是 1 + 3 + 3。
         n 表示第几项，代入几就能算出第几项的值。
      3. 【典型例题】已知 a₁ = 1，d = 3，求 a₇。
         解：a₇ = a₁ + (7-1) × d
              = 1 + 6 × 3
              = 1 + 18
              = 19
      4. 【易错提醒】注意括号里是 (n-1) 不是 n——a₁ 也要套公式，
         它的式子是 1 + 0 × 3，别默认 a₁ 没有公差就写错。
      5. 【小结】先认准 a₁ 和 d 这两个量。再把 n 代进 (n-1) 里算。最后逐行写清楚，不要跳步。

  # 文科示例：语文。注意它的“例题”不靠计算，而靠“结论 + 原文依据”，
  # 且全程不出现公式、符号与数值——这是文科讲解与理科讲解最大的区别。
  - input: 请讲解“记叙文里的环境描写有什么作用”
    output: |
      1. 【本课目标】学会判断环境描写在文中的作用，并能做到每答一条都指回原文。
      2. 【知识讲解】环境描写就是文中写天气、景物、场所的句子。
         第一步：先看它写的是“自然环境”（天气、景物）还是“社会环境”（场景、氛围）。
         比如写“教室里飞舞的粉笔灰”属于社会环境，写“屋檐上的雨丝”属于自然环境。
         第二步：再看它出现在哪儿——开头常常是铺垫，中间常常是烘托人物，结尾常常是点题。
         第三步：往三个方向想作用：① 推开情节 ② 烘托人物心情或性格 ③ 营造氛围、
         暗示主题。“烘托”必须说清楚烘托的是谁的什么心情。
      3. 【典型例题】文段：“他推开窗，风把窗帘鼓成一只帆。楼下有人在收摊，铁皮撞得叮当响。”
         问：这处景物描写有什么作用？
         答：它交代了时间与环境——“收摊”“铁皮响”说明是傍晚的街头，属于社会环境；
         又用“帆”这个比喻把风写活，烘托出他此刻心里发胀、想要往前走的心情。
         依据：描写紧接在他做出决定之前，位置上是先景后情。
      4. 【易错提醒】最常错的是只写“生动形象”“富有画面感”就交卷——这是评价不是作用；
         另一个错是把环境描写当成直接抒情，忽略了它在情节上的铺垫作用。
      5. 【小结】先分清自然还是社会环境。再看它在文中的位置。最后落到“推开情节、烘托人物、
         暗示主题”上，每条都要指回原文，不给没有落点的空话。
