# 教师 Agent（PPT 课件制作）Few-shot 示例
#
# 为什么这两例必须存在：若复用 teacher 的范文（因式分解讲解、环境描写讲解），
#   范例体例就是**讲解体**（【本课目标】【知识讲解】…），模型会照着往教学模块上靠，
#   于是无论模板怎么写，输出都长成一堂课而不是逐页课件。这份同名示例把体例锚死成：
#   【课件主题】→【整体结构】→【逐页大纲】（第N页（类型）：标题 + · 要点 + 配图 + 旁白）→【视觉建议】。
#
# 旁白是「每页的完整讲稿」：100-250 字、能照着讲 30-60 秒、用于配音，把要点讲透
#   （是什么 + 为什么 + 举例或提问 + 过渡），不是两三句就收的提示——这是
#   「PPT 要配旁白、内容不能单薄」的示范落点。
#
# 覆盖梯度：文理各一例（本角色文理两条轨道都用）。
#   ① 理科例（初中化学）：锚定「实验现象 → 定律 → 微观解释」这条理科逻辑线。
#   ② 文科例（初中历史）：锚定「史料 → 背景 → 影响」这条文科逻辑线。
#   只给一例，模型会把所有课件都套同一套页型结构。
#
# 两份示例的主题均为**自拟**，且刻意避开演示与评测用例里出现过的内容
#   （物理浮力、欧姆定律、秦统一、爱莲说等），免得照抄检测把正常输出判成抄袭。
name: teacher_ppt
label: 教师Agent·PPT课件制作 Few-shot 示例
examples:
  - input: |
      学科：初中化学
      课件主题：质量守恒定律
      页数要求：8
      学生水平：基础
      单元内容：无
    output: |
      1. 【课件主题】给基础档的学生讲「质量守恒定律」，共 8 页。

      2. 【整体结构】三部分：导入（第1-2页，从生活现象引出问题）→ 展开（第3-7页，实验、定律、应用）→ 小结（第8页，回扣）。逻辑线：先看到「质量去哪了」，再用实验证明「没消失」，最后用微观解释「为什么没消失」。

      3. 【逐页大纲】
      第1页（封面）：质量守恒定律
      · 课题名
      · 适用：初三化学
      配图：一架天平，两端分别标「反应前」「反应后」
      旁白：同学们好，今天我们学习化学里一条最基础的规律——质量守恒定律。先请大家想一个问题：一张纸烧掉以后，剩下的灰烬比原来轻得多，那少掉的质量到哪里去了？是凭空消失了吗？今天这节课，我们就要用实验来回答这个问题。学完之后，你就能用这条定律去解释生活里很多「质量变化」的现象。

      第2页（导入）：烧完的木头去哪了
      · 木头烧完只剩一小堆灰
      · 少掉的质量去哪了？
      配图：木柴燃烧前后对比图
      旁白：先看一个大家熟悉的场景。一根木头在炉子里烧完，最后只剩下一小堆灰，用手一掂，明显轻了很多。很多同学会说，木头烧掉了，质量减少了。但化学上要追问一句：那些「消失」的质量，是真的没了，还是变成了我们看不见的东西跑到空气里了？带着这个疑问，我们来做今天的第一个实验。

      第3页（内容）：实验：白磷在密闭容器中燃烧
      · 密闭容器内白磷燃烧
      · 反应前后称量：质量不变
      配图：白磷燃烧实验装置示意图
      旁白：这是本课最关键的一个实验。我们把白磷放进一个密闭的容器里点燃，等它完全燃烧以后，把整个装置原封不动地放到天平上称。结果你会发现，反应前后的总质量几乎一模一样。这里要特别强调「密闭」两个字——如果敞着口做，燃烧产生的气体就会跑掉，天平自然就轻了，那不是质量消失了，而是质量跑掉了。

      第4页（内容）：定律表述
      · 参加反应的物质质量总和
      · 等于生成物质量总和
      配图：定律文字卡片，关键词「参加反应」高亮
      旁白：由这个实验，我们就能总结出质量守恒定律的内容：参加化学反应的各物质质量总和，等于反应后生成的各物质质量总和。请大家把注意力放在「参加反应」这四个字上，这是整条定律最容易出错的地方。所谓「参加反应」，就是真正发生了反应的那部分，多余的反应物不能算进去。比如 4 克氢气和 32 克氧气反应，如果氢气只反应了 2 克，那剩下的 2 克不能算。

      第5页（例题）：一道计算
      · 4g 氢气与 32g 氧气反应
      · 生成多少克水？
      配图：题干 + 分步计算过程
      旁白：我们做一道题巩固一下。4 克氢气和 32 克氧气反应，能生成多少克水？根据质量守恒，反应物总质量等于生成物总质量，所以水的质量就是 4 加 32，等于 36 克。但这里藏着一个坑：如果有一种物质过量，就要先判断谁真正「参加反应」。比如氧气只有 32 克，氢气却有 8 克，那就只有 4 克氢气参加反应，剩下的 4 克不参与，不能直接相加。

      第6页（练习）：随堂一题
      · 铁生锈后质量变大
      · 是否违反定律？
      配图：生锈铁钉图
      旁白：再考大家一道判断题。铁放在潮湿的空气里会生锈，生锈以后质量反而变大了，这是不是违反了质量守恒定律？先别急着下结论。想一想，铁生锈的过程里，有没有从空气里「吃」进什么东西？对了，铁和空气中的氧气结合，生成铁锈，质量当然变大。这不但不违反定律，反而正好证明了定律成立。

      第7页（内容）：微观解释
      · 原子种类、数目、质量不变
      · 所以总质量不变
      配图：化学方程式配平前后的原子对比图
      旁白：为什么化学反应前后质量一定守恒？我们要钻到微观世界去看一看。在化学反应里，原子会重新组合，但原子的种类没有变、数目没有变、每个原子的质量也没有变。既然原子一个没多、一个没少，只是重新排了排队，那总质量当然就不变了。记住这句话：质量守恒的本质，是原子的种类、数目、质量都不变。

      第8页（小结）：本课小结
      · 定律内容
      · 守恒的微观原因
      · 易错点：别漏「参加反应」
      配图：三个要点汇总图
      旁白：最后我们把今天的内容串一遍。质量守恒定律说的是，参加反应的各物质质量总和，等于生成物的各物质质量总和。它的微观原因是原子不变。现在再回头看开头的木头问题，你应该能自己解释了：木头烧掉的那部分质量，变成了二氧化碳和水蒸气跑到空气里，并没有消失。这就是质量守恒，谢谢大家。

      4. 【视觉建议】主色白底加浅蓝点缀，标题用黑体、正文用宋体；实验装置用简洁示意图，结论页用浅色卡片高亮关键词。

  - input: |
      学科：初中历史
      课件主题：丝绸之路
      页数要求：9
      学生水平：中等
      单元内容：无
    output: |
      1. 【课件主题】给中等档的学生讲「丝绸之路」，共 9 页。

      2. 【整体结构】三部分：导入（第1-2页，从一件文物引出）→ 展开（第3-8页，路线、人物、交流、影响）→ 小结（第9页，回扣）。逻辑线：先看「一条路怎么被发现」，再看「谁走的、运了什么」，最后落到「它把世界连起来了」。

      3. 【逐页大纲】
      第1页（封面）：丝绸之路
      · 课题名
      · 适用：初一历史
      配图：沙漠驼队剪影图
      旁白：同学们好，今天我们要讲一条古代最著名的商路——丝绸之路。听到「丝绸」这两个字，你可能马上想到中国的丝绸。没错，中国的丝绸正是沿着这条路走向世界的，所以后人给它起了这个名字。但它运送的东西远不止丝绸，它更重要的作用，是把东方和西方连在了一起。我们一起来看这条路是怎么被发现的。 可能的提问：听到「丝绸之路」这四个字，你最先想到的是什么？

      第2页（导入）：一件文物的疑问
      · 汉代墓葬里出土了西方风格的玻璃器
      · 它是怎么来到中国的？
      配图：玻璃器文物照片
      旁白：先看一件文物。考古学家在汉代的墓葬里，挖出了一件带有西方风格的玻璃器。这就引出一个问题：两千多年前，一件西方的东西，是怎么跑到中国来的？答案只有一个——早在汉代，东西方之间就已经有了往来。那么这条往来的通道是怎么打开的？这就引出我们今天的主角，张骞。 可能的提问：一件两千多年前的西方玻璃器，为什么会出现在汉代的中国？

      第3页（内容）：张骞通西域
      · 汉武帝派张骞出使西域
      · 两次出使，打开了通路
      配图：张骞出使路线图
      旁白：打开这条路的人，是张骞。汉武帝时期，为了联合大月氏共同对付匈奴，派张骞出使西域。张骞这一去，历经艰险，前后两次出使，虽然联合大月氏的军事目的没有完全达到，却意外地打开了一条通往西域的道路，还带回了大量关于西域的情报。后人把这件事叫做「凿空」，意思是硬生生凿开了一条路，非常形象。 可能的提问：张骞出使西域本来是要去做什么的？为什么后人反而称他「凿空」？

      第4页（内容）：路线
      · 从长安出发，经河西走廊、西域
      · 到达中亚、西亚，再到欧洲
      配图：丝绸之路主干道地图
      旁白：我们在地图上把这条路线走一遍。陆上丝绸之路从长安出发，经过河西走廊，穿过西域，一路向西到达中亚、西亚，最远可以到欧洲。请同学们记住几个关键地名：长安、河西走廊、西域。考试的时候，常常会让你指出这条路经过哪些地区，只要记住这条「长安—河西走廊—西域—中亚」的主线，就不会错。 可能的提问：从长安出发去欧洲，你会依次经过哪几个关键地区？

      第5页（内容）：输出与输入
      · 输出：丝绸、瓷器、漆器
      · 输入：良马、葡萄、苜蓿、佛教
      配图：输出品与输入品的对比图
      旁白：这条路上到底运了什么？我们用两组词来记。中国输出的是丝绸、瓷器、漆器，从西方输入的是良马、葡萄、苜蓿，还有佛教。注意，这是双向的交流，不是单方面的输出。大家想一想，除了书上这些，还有哪些东西是沿着这条路传进来的？比如我们今天常吃的胡萝卜、石榴，其实都是丝绸之路带来的。 可能的提问：这条路上运的东西是单向输出，还是双向交流？各举一例。

      第6页（内容）：海上丝绸之路
      · 汉武帝后开通海上航线
      · 从东南沿海到印度洋
      配图：海上丝绸之路航线图
      旁白：别以为丝绸之路只有陆上一条。汉武帝以后，还开通了海上的航线，从东南沿海出发，穿过马六甲海峡，到达印度洋沿岸，最远到非洲东海岸。所以严格来说，「丝绸之路」是一个通道网，陆上、海上都有。那海上和陆上哪条更早呢？陆上更早，海上丝绸之路是后来才兴起的。 可能的提问：陆上和海上两条通道，哪一条出现得更早？

      第7页（内容）：影响
      · 促进东西方经济文化交流
      · 使中华文明与世界相连
      配图：交流成果示意图
      旁白：丝绸之路带来了什么影响？首先是经济上，东西方的商品互相流通，丝绸、瓷器卖到西方，西域的物产进入中国。更重要的是文化上，佛教就是沿着这条路传入中国的，中国的造纸术等技术也传到了西方。所以说，丝绸之路促进了东西方经济文化的交流，让中华文明和世界连在了一起。这是它最深远的意义。 可能的提问：丝绸之路最重要的影响是经济上的，还是文化上的？为什么？

      第8页（练习）：看图说话
      · 对照地图，说出陆上丝绸之路经过的地区
      配图：古今地名对照地图
      旁白：现在轮到大家了。请对照这张古今地名对照的地图，说出陆上丝绸之路经过了今天哪些地区。提示一下：从今天的陕西西安出发，经过甘肃、新疆，再往西就是中亚各国。谁来试着说一说？想一想，这些地方现在分别属于哪些国家？这个问题能帮助你理解「丝绸之路」在今天依然是一条重要的交流通道。 可能的提问：对照今天的地图，长安和西域大致相当于今天的哪些地方？

      第9页（小结）：本课小结
      · 路线：长安—西域—中亚—欧洲
      · 人物：张骞
      · 意义：东西方交流的桥梁
      配图：三要点汇总图
      旁白：最后我们把今天的内容总结一下。丝绸之路从长安出发，经过西域，最远到达欧洲；它的开辟者是张骞；它的意义在于成为东西方交流的桥梁。现在再回头看开头那件玻璃器，你就能明白——它就是这样，沿着丝绸之路，一步步来到中国的。这就是我们今天学的丝绸之路。 可能的提问：用一句话说清丝绸之路的起点、开辟者和意义。

      4. 【视觉建议】主色白底加浅土黄点缀，标题用楷体突出历史感；地图统一用简洁线描，文物照片占一角即可。
