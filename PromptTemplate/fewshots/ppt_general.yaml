# 通用 PPT 制作者（ppt_general）Few-shot 示例
#
# 为什么这两例必须存在：若复用 teacher_ppt 的范文（质量守恒 / 丝绸之路），
#   范例体例是**课件体**（旁白是配音讲稿、页类型是导入/例题/练习），模型会照着
#   往「上课」上靠；通用 PPT 要的是**逐页大纲体**——每页「标题 + 要点 + 配图 + 旁白」，
#   但旁白是「演讲提示」（先说结论、再给依据、最后过渡），页类型是背景/现状/方案/数据等。
#   这份同名示例把体例锚死，并演示「场景 → 结构」确实在变。
#
# 覆盖梯度：文理各一例，且场景刻意不同，各示范一条结构骨架：
#   ① 理科例（汇报 · 受众=老板）：锚定「现状→问题→原因→方案→计划」这条汇报逻辑线。
#   ② 文科例（路演 · 受众=投资人）：锚定「痛点→产品方案→优势→数据证据→愿景行动」这条路演逻辑线。
#   只给一例，模型会把所有场景都套同一套页型与结构，场景骨架就形同虚设。
#
# 两份示例的主题均为**自拟**，且刻意避开 teacher_ppt 的范文与评测用例出现过的内容
#   （质量守恒 / 丝绸之路 / 勾股定理 / 中国的气候等），免得照抄检测把正常输出判成抄袭。
name: ppt_general
label: 通用PPT制作者 Few-shot 示例
examples:
  - input: |
      主题：智能客服系统年度商业化汇报
      场景：汇报
      受众：老板
      页数要求：10
      核心重点：续费率下降、获客成本上升、下季度聚焦大客户
      边界：不展开底层算法细节
      风格偏好：商务简洁
    output: |
      1. 【主题与受众】给老板看的汇报类 PPT，主题「智能客服系统年度商业化汇报」，共 10 页。

      2. 【整体结构】五部分：现状（第1-3页，成绩单）→ 问题（第4页，两个下滑信号）→ 原因（第5页，客户分层）→ 方案（第6-8页，聚焦大客户）→ 计划（第9页，拍板三件事，第10页结束）。逻辑线：先亮成绩，再揭问题，找到原因，给出方案，最后要决策。

      3. 【逐页大纲】
      第1页（封面）：智能客服系统年度商业化汇报
      · 2026 年度商业化汇报
      · 汇报：增长事业部
      配图：产品主视觉 + 年度数字亮点
      旁白：各位领导好，今天我汇报智能客服系统这一年的商业化情况，大概十五分钟。我先说结论：收入做到了，但有两个信号要重视——续费率在降、获客成本在涨。接下来用五个部分讲清楚：先看成绩单，再看两个下滑信号，然后分析原因，接着给出下季度方案，最后是要请各位拍板的三件事。好，我们从成绩单开始。

      第2页（目录）
      · 现状：成绩单
      · 问题与原因
      · 方案与计划
      配图：五个章节的目录卡片
      旁白：这是今天的目录，一共五个部分。第一部分是现状，我把今年最关键的几个数字放在一起；第二和第三部分连着讲，先看两个下滑的信号，再说清楚为什么下滑；第四部分是方案，核心就一句——下季度把资源集中到大客户；第五部分是计划，也就是需要各位今天拍板的三件事。大家心里有了这个框架，后面听数字会更有重点。

      第3页（现状）：今年商业化成绩单
      · 全年收入 1.2 亿，超额 8%
      · 客户数 480 家，同比 +32%
      · 大客户贡献收入占 61%
      配图：收入与客户数双轴图
      旁白：先看成绩单。全年收入一点二亿，比目标超额八个点，客户数四百八十家，同比增长三成二。但最值得注意的一个数字是：大客户只占客户总数的两成，却贡献了六成一的收入。这个结构很重要，后面讲方案时会反复用到——它说明我们的收入底盘其实集中在一小撮大客户身上。成绩单先放到这，接下来看两个不太好看、但必须正视的信号。

      第4页（问题）：两个下滑信号
      · 续费率 72%，三年最低
      · 获客成本涨 45%
      配图：续费率与获客成本走势图
      旁白：成绩单背后有两个下滑信号，我先说结论：续费率降到百分之七十二，是三年最低；同时单个新客户的获客成本涨了四成五。这两个数字一上一下，说明我们的增长质量在变差——一边是老客户留不住，一边是拉新越来越贵。如果只看收入总额，这两个问题会被增长盖住。接下来一页，我把这两个信号背后的原因拆开讲。

      第5页（原因）：为什么恶化
      · 中小客户续费拖累大盘
      · 大客户续费率 91%，仍健康
      · 获客成本高在中小客户投放
      配图：按客户分层的续费率对比柱状图
      旁白：原因就藏在客户分层里。我把续费率拆开看：大客户的续费率是百分之九十一，其实是健康的；拖累大盘的是中小客户，他们续费率掉到了六成以下。获客成本也一样，涨的部分主要花在中小客户的投放上，转化率低、客单价低。换句话说，问题不是产品不行，而是我们把资源平均撒在了所有客户上。这个判断直接引出下一页的方案。

      第6页（方案）：下季度聚焦大客户
      · 资源向大客户倾斜
      · 中小客户转自助服务
      · 目标：续费率回到 80%
      配图：资源再分配示意图
      旁白：基于上一页的判断，下季度的方案就一句：把资源集中到大客户。具体三层意思：销售和成功团队主攻大客户，中小客户转成自助和标准化服务，目标是让整体续费率回到八成。这样做是有依据的——大客户续费率九成一，只要保住他们、再多签几家，收入底盘就稳了。下一页我用一组已经跑通的数据，证明这条路可行。

      第7页（数据）：大客户模型已跑通
      · 试点 12 家大客户
      · 续费率 94%、增购 3 家
      配图：试点效果数据卡片
      旁白：这不是空想，我们已经在十二家大客户上跑了三个月试点。结果：试点客户的续费率做到百分之九十四，比大盘高二十二个点；而且其中三家在合同期内追加了采购。这说明大客户的打法是被验证过的，不是拍脑袋。有了这组数据，下季度把这个模型从十二家复制到五十家，逻辑是通的。最后两页，我讲具体怎么落地，以及需要各位拍板的三件事。

      第8页（方案）：三步落地
      · 成立大客户专项组
      · 中小客户切自助产品线
      · 月度盯续费率看板
      配图：三步时间线
      旁白：落地就三步。第一步，把最资深的三个人抽出来成立大客户专项组，专盯前五十家；第二步，中小客户切到自助产品线，用标准化话术和工单承接，不再占用销售人力；第三步，建立月度续费率看板，每个月底对着数字复盘，谁掉谁负责。三步都不需要新增预算，只做资源重排，下个月就能启动。最后一页，是需要各位今天明确拍板的三件事。

      第9页（总结）：要拍板的三件事
      · 批：大客户专项组编制
      · 批：中小客户转自助
      · 定：续费率 80% 为 Q3 目标
      配图：三项决议清单
      旁白：最后是请各位拍板的三件事。第一，批准大客户专项组的三人编制；第二，同意中小客户全面转自助产品线；第三，把续费率百分之八十定为下季度硬目标。这三件事定了，方案下周一就能启动，预计下季度末续费率回到八成、获客成本降两成。我的汇报就到这里，请各位领导指示。

      第10页（结束）：谢谢
      · 谢谢
      · 欢迎提问
      配图：品牌尾页
      旁白：以上就是今天的全部汇报，谢谢各位的时间。总结一句：收入已经跑赢目标，但增长质量要靠聚焦大客户来修，方案有试点数据支撑、不新增预算，就等三件事拍板。欢迎大家提问，我会就数字和方案再展开。

      4. 【视觉建议】主色白底+浅蓝点缀，标题黑体、正文思源黑体；数据页统一用柱状图+趋势线，方案页用时间线，封面与结束页用品牌主视觉；整体留白充足、每页不超过 5 条要点。

  - input: |
      主题：社区养老服务创业项目路演
      场景：路演
      受众：投资人
      页数要求：9
      核心重点：千亿市场规模、单店模型跑通、可复制扩张路径
      边界：不展开政策补贴测算细节
      风格偏好：科技感
    output: |
      1. 【主题与受众】给投资人看的路演类 PPT，主题「社区养老服务创业项目路演」，共 9 页。

      2. 【整体结构】五部分：痛点（第1-2页）→ 产品方案（第3-4页）→ 数据证据（第5-6页）→ 愿景行动（第7-8页）→ 结束（第9页）。逻辑线：先讲市场痛点，再给产品方案，用数据证明可行，最后落到愿景与融资。

      3. 【逐页大纲】
      第1页（封面）：社区养老服务创业项目
      · 社区养老服务站
      · 让老人在家门口养老
      配图：项目品牌主视觉
      旁白：各位投资人好，我带来的是一个社区养老服务项目。用一句话说：我们在社区里开服务站，让老人在家门口解决吃饭、看病、照护三件事。今天用九页讲清楚五件事：这个市场有多大、痛点是什么、我们怎么做、凭什么能成、以及这轮融资怎么用。先从一个最真实的场景说起。

      第2页（问题）：痛点——老人三难
      · 吃饭难、就医难、照护难
      · 养老院远且贵
      配图：老人生活痛点场景图
      旁白：先说痛点。中国现在两亿多老人，绝大多数选择居家养老，但他们面对三难：吃饭难、就医难、照护难。子女上班没时间，养老院又远又贵，平均每月六七千，多数家庭负担不起。结果就是老人在家硬扛，出了事才被发现。这就是我们的机会——在社区里、用低成本，把这三件事就近解决掉。

      第3页（方案）：社区养老服务站
      · 一站解决吃饭/就医/照护
      · 单站覆盖周边 3000 老人
      配图：服务站功能布局图
      旁白：我们的方案是社区养老服务站，一个站覆盖周边三千位老人，提供三样核心服务：配餐、基础医疗、日常照护。老人走几分钟就能到，价格是养老院的十分之一。服务站的本质，是把分散的需求在一个物理空间里集中解决，这样既摊薄了成本，又能标准化复制。下一页讲我们和已有的养老机构比，三个真正的差异点。

      第4页（优势）：三个差异化优势
      · 选址在社区内，距离近
      · 全职+兼职护理，成本低
      · 数字化台账，子女可查
      配图：三项优势对比图
      旁白：我们的优势有三条。第一，选址在社区里面，老人步行可达，这是养老院做不到的；第二，人力用全职加兼职的组合，成本比机构低一半以上；第三，每个老人的服务都记进数字化台账，子女在手机上随时能看，解决了信任问题。这三条合起来，就是我们的护城河：离得近、成本低、看得见。下一页用数据证明这个模型真的跑得通。

      第5页（数据）：单店模型已跑通
      · 单店月营收 22 万
      · 8 个月回本
      · 复购率 84%
      配图：单店经营数据卡片
      旁白：说数据。我们在杭州已经开了三家站，最成熟的一家：月营收二十二万，八个月收回投资，老人和家庭的月度复购率八成四。这三个数字说明两件事：一是需求是真的，老人愿意为家门口的服务持续付费；二是模型能盈利，不是靠补贴堆出来的。单店模型跑通，意味着下一步可以复制。下一页看这个市场到底有多大。

      第6页（数据）：市场有多大
      · 社区养老市场千亿级
      · 未来十年老人翻倍
      配图：市场规模预测图
      旁白：市场有多大？按社区养老口径算，是千亿级别的市场，而且未来十年老年人口还要翻一倍。我们不需要吃下整个市场，哪怕只在一百个城市各开十家站，就是一千家站、几十亿营收的盘子。关键是这个市场目前极度分散，没有头部品牌，先跑通模型的玩家有先发优势。这就是我们为什么要现在融资、快速扩张。

      第7页（总结）：愿景——三年百城
      · 三年覆盖 100 城
      · 1000 家站、服务 300 万老人
      配图：扩张路线图
      旁白：我们的愿景：三年覆盖一百个城市、开出一千家站、服务三百万老人，做成社区养老的第一品牌。实现路径分三步：今年在长三角开满五十家，明年复制到十个省，第三年铺开全国。每复制一家，就复用已经标准化的选址、人力、台账三套手册，扩张速度会越来越快。最后一页讲这轮融资怎么用。

      第8页（方案）：本轮融资与用途
      · 融资 3000 万
      · 用于开 50 家站 + 数字化系统
      配图：资金用途占比图
      旁白：这轮我们融三千万，用途很明确：六成用来新开五十家站，两成投到数字化系统，两成作为运营储备。按单店八个月回本测算，这笔钱能在明年年底前把模型复制到十个城市，届时整体营收预计翻三倍。我们愿意接受对赌，用续费和复购数据说话。以上就是全部内容，谢谢。

      第9页（结束）：谢谢
      · 谢谢
      · 期待深入交流
      配图：品牌尾页 + 联系方式
      旁白：谢谢各位的时间。最后再强调一遍我们的三个关键词：千亿市场、单店模型已跑通、可复制。我们不是在做养老院的改良，而是重新定义社区养老的入口。欢迎会后交流，我们准备了完整的单店数据包可以随时提供。谢谢。

      4. 【视觉建议】主色白底+暖橙点缀，标题圆体、正文思源黑体；数据页用大数字卡片，痛点页用写实场景图，扩张页用地图动线；整体科技感、留白多、每页信息精炼。
