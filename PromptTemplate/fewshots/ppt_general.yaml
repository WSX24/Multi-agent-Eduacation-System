# 教学 PPT 制作者（ppt_general）Few-shot 示例
#
# 为什么这两例必须存在：若复用 teacher_ppt 的范文（质量守恒 / 丝绸之路），
#   范例体例是**课件体**（旁白是配音讲稿、页类型是导入/例题/练习），模型会照着
#   往「上课」上靠；本角色要的是**逐页大纲体**——每页「标题 + 要点 + 配图 + 旁白」，
#   但旁白是「演讲提示」（先说结论、再给依据、最后过渡），页类型是内容/案例/对比/练习等。
#   这份同名示例把体例锚死，并示范教学骨架「概念→原理步骤→示例→练习→小结」。
#
# 覆盖梯度：文理各一例，各示范一条教学结构骨架：
#   ① 理科例（全等三角形的判定）：锚定「概念→原理步骤→示例→练习→小结」这条逻辑线。
#   ② 文科例（议论文的论证方法）：同一条骨架落到写作教学，证明骨架不挑学科。
#   只给一例，模型会把所有主题都套同一套页型与结构，教学骨架就形同虚设。
#
# 两份示例的主题均为**自拟**，且刻意避开 teacher_ppt 的范文与评测用例出现过的内容
#   （质量守恒 / 丝绸之路 / 勾股定理 / 中国的气候等），免得照抄检测把正常输出判成抄袭。
name: ppt_general
label: 教学PPT制作者 Few-shot 示例
examples:
  - input: |
      主题：全等三角形的判定
      场景：教学
      受众：学生
      页数要求：8
      核心重点：SSS、SAS 判定定理的条件与运用
      边界：不展开证明的严谨书写
      风格偏好：无
    output: |
      1. 【主题与受众】给学生看的教学类 PPT，主题「全等三角形的判定」，共 8 页。

      2. 【整体结构】五部分：概念（第1-2页，什么是全等、两条判定定理）→ 原理步骤（第3页，判定定理的适用条件）→ 示例（第4-5页，例题示范）→ 练习（第6页，学生练手）→ 小结（第7页，两定理对比，第8页结束）。逻辑线：先认识全等，再学判定定理，接着看例题、动手练，最后对比小结。

      3. 【逐页大纲】
      第1页（封面）：全等三角形的判定
      · 认识全等三角形
      · 学会 SSS 与 SAS 判定
      配图：两个完全重合的三角形示意图
      旁白：今天讲全等三角形的判定，先给结论：判断两个三角形是否全等，只要看三边、或两边一夹角，不用把六个元素都量一遍。这节课先认识什么是全等，再学 SSS 和 SAS 两条判定定理，最后通过例题和练习把它用熟。我们先从全等的定义开始。

      第2页（内容）：什么是全等三角形
      · 形状相同、大小相等
      · 完全重合的两个三角形
      · 对应边相等、对应角相等
      配图：两个三角形平移重合的动画示意
      旁白：全等就是完全一样：形状相同、大小也相等，把其中一个平移或旋转，能跟另一个完全重合。一旦全等，六对元素全部对应相等——三条边对应相等，三个角也对应相等。但反过来，我们是不是要把六个元素都量一遍才知道全等？不用，这就是下一页要讲的判定定理。

      第3页（内容）：两个判定定理
      · SSS：三边对应相等
      · SAS：两边及其夹角对应相等
      · 注意「夹角」不是任意角
      配图：SSS 与 SAS 的示意图并排对比
      旁白：判定定理有两条，先记结论：三边对应相等就全等，简称 SSS；两边和它们的夹角对应相等也全等，简称 SAS。这里最容易错的是 SAS 里的夹角——必须是这两条边中间夹的那个角，不是随便一个角。记住了这两个条件，看例题就知道怎么用了。

      第4页（案例）：例题——SSS 判定
      · 已知三边长度，判全等
      · 找对应边是关键
      配图：两个三角形标出对应三边
      旁白：看例题。给了两个三角形的三边分别相等，问是否全等。做法分两步：先按顺序把对应边配对，再核对三对是不是都相等。这里三对都相等，所以由 SSS 直接判定全等，结论要写清用了哪条定理。下一题把条件换成两边一夹角，体会 SAS 的用法。

      第5页（案例）：例题——SAS 判定
      · 两边加夹角，判全等
      · 强调夹角的正确选取
      配图：两个三角形标出两边与夹角
      旁白：这题给了两边和一个角，但角的位置要看清：这个角是不是两条边的夹角？如果是，就用 SAS；如果不是，条件不足，不能判定。所以第一步永远是确认角是不是夹角。确认是夹角、两边又对应相等，就能用 SAS 判定全等。两道例题之后，换你自己来试一题。

      第6页（练习）：动手试一试
      · 判断用 SSS 还是 SAS
      · 说明理由
      配图：练习题的三角形图形
      旁白：现在轮到你。题目给一个三角形的三条边，另一个三角形给两边一夹角，请你判断：第一组用哪条定理，第二组能不能判定。想清楚后，把定理名和理由一起说出来。判断的关键还是那句话——先看条件对得上哪条定理，再看角是不是夹角。我们下页做小结。

      第7页（总结）：两条定理对比
      · SSS 看三边
      · SAS 看两边一夹角
      · 都要求「对应相等」
      配图：SSS 与 SAS 对照表
      旁白：小结一下，两条判定定理：SSS 看三边，SAS 看两边和它们的夹角。共同点是都要对应相等，区别在条件不同。作业里先把已知条件列出来，再看对得上哪条定理。最后提醒一句：SAS 的角必须是夹角。今天的内容就到这。

      第8页（结束）：谢谢
      · 回顾：定义、两条定理、两道例题
      配图：课程要点清单
      旁白：今天的课就到这里，一起回顾：先认识了全等三角形的定义，再学了 SSS 和 SAS 两条判定定理，通过两道例题和一个练习掌握了用法。课后请把练习题再做一遍，重点体会夹角的判断。谢谢大家。

      4. 【视觉建议】主色用深蓝配浅灰，正文黑字，重点页用蓝色标题条；字体标题用思源黑体加粗、正文用微软雅黑；图表统一用扁平化示意图与对照表，避免复杂装饰。
  - input: |
      主题：议论文的论证方法
      场景：教学
      受众：学生
      页数要求：8
      核心重点：举例论证与对比论证的运用
      边界：不展开驳论文与立论文的分类
      风格偏好：无
    output: |
      1. 【主题与受众】给学生看的教学类 PPT，主题「议论文的论证方法」，共 8 页。

      2. 【整体结构】五部分：概念（第1-2页，什么是论证、两种论证方法）→ 原理步骤（第3页，两种方法的写法）→ 示例（第4-5页，范文片段示范）→ 练习（第6页，学生动笔）→ 小结（第7页，两方法对比，第8页结束）。逻辑线：先认识论证，再学两种方法，接着看范文、动笔练，最后对比小结。

      3. 【逐页大纲】
      第1页（封面）：议论文的论证方法
      · 学会举例论证
      · 学会对比论证
      配图：论点、论据、论证三者关系示意图
      旁白：今天讲议论文怎么写才有说服力，核心就一句：光有观点不够，要拿出论据、用好论证方法。这节课学两种最常用的方法——举例论证和对比论证。先明白什么是论证，再看这两种方法怎么写，最后通过范文和练习把它用熟。我们先从论证的概念开始。

      第2页（内容）：什么是论证
      · 用论据证明论点的过程
      · 论点、论据、论证三要素
      配图：论点—论据—论证的关系图
      旁白：论证，就是用论据来证明论点的过程。议论文有三个要素：论点是你的观点，论据是用来支撑的材料，论证是把两者连起来的桥梁。很多同学只堆例子、忘了点题，问题就出在论证这步没做好。接下来看两种能让论证变有力的方法。

      第3页（内容）：两种论证方法
      · 举例论证：用具体事例证明
      · 对比论证：正反对照显观点
      配图：两种论证方法的对比卡片
      旁白：第一种是举例论证，用真实、典型的事例来证明观点；第二种是对比论证，把正反两面放在一起对照，让观点在反差中更突出。举例让论证具体，对比让论证鲜明，两种可以单独用，也可以结合用。下面看范文片段，体会它们各自的写法。

      第4页（案例）：举例论证范文片段
      · 论点：坚持成就事业
      · 例证：司马迁著《史记》
      配图：范文片段摘录卡片
      旁白：看一个举例论证的片段。论点是坚持成就事业，作者举司马迁忍辱负重著《史记》的例子，把坚持落到一个具体的人、一件具体的事上。注意写法：先简述事例，再用一两句点明这个例子怎么证明论点，不能只讲故事不点题。这就是举例论证的要领。下页看对比论证。

      第5页（案例）：对比论证范文片段
      · 正面：坚持者成功
      · 反面：放弃者无成
      配图：正反对照的两栏排版示意
      旁白：再看对比论证。同样讲坚持，作者把坚持的人和放弃的人放在一起对照：一面是坚持后取得的成就，一面是半途而废后的遗憾，观点在反差里自然立起来。写的时候要选同一角度的正反两面，不能各说各话。两种方法都看过了，现在换你动笔。

      第6页（练习）：动手写一写
      · 用举例论证写一段
      · 用对比论证写一段
      配图：练习提示的文本框
      旁白：现在轮到你了。给一个论点，请你分别用举例论证和对比论证各写一段。写举例论证时，记住先叙事、再点题；写对比论证时，正反两面要选同一个角度。写完后自己读一遍，看论据是不是真的支撑了论点。我们下页做小结。

      第7页（总结）：两种方法对比
      · 举例论证让观点具体
      · 对比论证让观点鲜明
      · 都要紧扣论点
      配图：两种论证方法的对照表
      旁白：小结一下。举例论证用事例让观点具体可信，对比论证用正反对照让观点鲜明突出，但两者有个共同底线：论据必须紧扣论点，不能偏离。写作时先想清楚论点，再决定用哪种方法，或者两者结合。今天的内容就到这。

      第8页（结束）：谢谢
      · 回顾：论证、两种方法、写作要领
      配图：课程要点清单
      旁白：今天的课到这里，一起回顾：先理解了论证是用论据证明论点，再学了举例论证和对比论证两种方法，通过范文和练习掌握了写法。课后请完成练习，写的时候重点体会先叙事再点题和正反对照这两个要领。谢谢大家。

      4. 【视觉建议】主色用暖棕配米白，正文深灰，关键词用红色标出；字体标题用思源黑体加粗、正文用微软雅黑；图表统一用摘录卡片与对照表，保持留白，避免大段文字。
