# 教师 Agent（短周期速成）Few-shot
#
# ⚠️ 本示例是「骨架示例」：数量与结构具体，内容全部为占位符。
#
# 为什么不用完整实例：实测完整实例在**同题撞车**时会被整段搬走
# （学生问「解一元一次方程应用题」，输出与示例逐字重合 18.3 处、最长 105 字，
#   而且重试闸门救不回来——重试改不掉上下文里的示例）。
#
# 为什么不用「换成非学科主题」：那样只是把撞车变成小概率，不是消除；
# 且其失败模式（示例主题漏进输出）需要维护领域词表才能检测，
# 而手写词表既脆弱又容易误判。
#
# 骨架示例的好处：
#   1. 结构性免疫——没有任何内容可抄，换任何学科、任何知识点都不会撞车
#   2. 数量约束仍被示范——真列 3 个里程碑、每里程碑 2 题、5 道测验题
#   3. 失败模式可程序化检测——漏出 `<占位符>` 用正则 <[^>]+> 即可 100% 捕获
#
# 实测（每条件 5 次）：跨学科格式合规 98.8%、同题 100%、照抄 0 处、占位符泄漏 0 处。
# 对比：完整实例同题照抄 18.3 处 / 最长 105 字；不用示例则合规率掉到 81.4%。
name: teacher_sprint
label: 教师Agent·短周期速成 Few-shot（骨架示例）
examples:
  - input: |
      学科：<学科>
      学习目标：<一句话说明要掌握什么>
      可用时限：<时限>
      学生水平：<入门/基础/进阶/竞赛>
      产出要求：每个里程碑配 2~3 道随堂练习（含答案与要点）；
               结束测验 5~8 题（含答案与解析）；末尾给出自评标准。
    output: |
      【速成目标】<时限>内你能<达成什么>。主动舍弃：<哪些内容>——<时限>里性价比太低。

      【学习路径】
      | 序号 | 里程碑 | 用时 | 学什么 | 练什么 |
      |---|---|---|---|---|
      | M1 | <第一个里程碑名> | <如 1.5小时> | <学什么> | <练什么> |
      | M2 | <第二个里程碑名> | <如 3小时> | <学什么> | <练什么> |
      | M3 | <第三个里程碑名> | <如 4.5小时> | <学什么> | <练什么> |

      【核心讲解】
      M1 <里程碑一的要点>：<不超过五句，讲清遇到题怎么下手>。
      M2 <里程碑二的要点>：<不超过五句>。
      M3 <里程碑三的要点>：<不超过五句>。

      【随堂练习】
      M1-1 <针对 M1 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M1-2 <针对 M1 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M2-1 <针对 M2 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M2-2 <针对 M2 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M3-1 <针对 M3 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M3-2 <针对 M3 的题>。
      【答案】<答案>。【要点】<一句话要点>。

      【结束测验】
      1. <覆盖全部里程碑的题>。
      【答案】<答案>。【解析】<解析>。
      2. <题>。
      【答案】<答案>。【解析】<解析>。
      3. <题>。
      【答案】<答案>。【解析】<解析>。
      4. <题>。
      【答案】<答案>。【解析】<解析>。
      5. <题>。
      【答案】<答案>。【解析】<解析>。
      【自评标准】<对几题算过关；错了该回头练哪个里程碑>。

      【时间提醒】<进度落后时优先保住哪个里程碑，以及为什么>。
