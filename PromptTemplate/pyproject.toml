[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompttemplate"
version = "0.1.0"
description = "教学多智能体 Prompt 模板库（角色扮演 + Few-shot + CoT）"
requires-python = ">=3.8"
dependencies = ["PyYAML>=6.0"]

# prompt_builder.py 是单文件模块，必须用 py-modules 声明才能被打包
[tool.setuptools]
py-modules = ["prompt_builder"]
