name: variant_b_skeleton
label: 变体B·骨架示例（数量具体，内容抽象）
# 设计意图：把「内容」全部挖成占位符，物理上无从抄起；
# 但**数量与结构保持具体**——真列 3 个里程碑、每里程碑 2 题、5 道测验题，
# 这样「2~3 题/里程碑」「5~8 题测验」这类数量约束仍有示范。
# 注意：刻意不使用 `...` 之类省略写法，避免模型原样抄出（M1 模板曾踩过这个坑）。
examples:
  - input: |
      学科：<学科>
      学习目标：<一句话说明要掌握什么>
      可用时限：<时限>
      学生水平：<入门/基础/进阶/竞赛>
      产出要求：每个里程碑配 2~3 道随堂练习（含答案与要点）；
               结束测验 5~8 题（含答案与解析）；末尾给出自评标准。
    output: |
      【速成目标】<时限>内你能<达成什么>。主动舍弃：<哪些内容>——<时限>里性价比太低。

      【学习路径】
      | 序号 | 里程碑 | 用时 | 学什么 | 练什么 |
      |---|---|---|---|---|
      | M1 | <第一个里程碑名> | <如 1.5小时> | <学什么> | <练什么> |
      | M2 | <第二个里程碑名> | <如 3小时> | <学什么> | <练什么> |
      | M3 | <第三个里程碑名> | <如 4.5小时> | <学什么> | <练什么> |

      【核心讲解】
      M1 <里程碑一的要点>：<不超过五句，讲清遇到题怎么下手>。
      M2 <里程碑二的要点>：<不超过五句>。
      M3 <里程碑三的要点>：<不超过五句>。

      【随堂练习】
      M1-1 <针对 M1 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M1-2 <针对 M1 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M2-1 <针对 M2 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M2-2 <针对 M2 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M3-1 <针对 M3 的题>。
      【答案】<答案>。【要点】<一句话要点>。
      M3-2 <针对 M3 的题>。
      【答案】<答案>。【要点】<一句话要点>。

      【结束测验】
      1. <覆盖全部里程碑的题>。
      【答案】<答案>。【解析】<解析>。
      2. <题>。
      【答案】<答案>。【解析】<解析>。
      3. <题>。
      【答案】<答案>。【解析】<解析>。
      4. <题>。
      【答案】<答案>。【解析】<解析>。
      5. <题>。
      【答案】<答案>。【解析】<解析>。
      【自评标准】<对几题算过关；错了该回头练哪个里程碑>。

      【时间提醒】<进度落后时优先保住哪个里程碑，以及为什么>。
