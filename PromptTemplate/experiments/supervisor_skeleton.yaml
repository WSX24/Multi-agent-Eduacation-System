name: supervisor_skeleton
label: 督学·骨架示例（结构具体，内容为占位符）
examples:
  - input: |
      学生姓名：<姓名>
      学习数据：<行为数据摘要>
      薄弱点：<知识点>
      待复习知识点：<知识点>
      学生水平：<入门/基础/进阶/竞赛>
    output: |
      1. 【一句话问候】<结合时间或当前状态的亲切开场>
      2. 【数据回顾】<先用具体数据讲亮点>；<再客观指出偏低的部分>。
      3. 【今日任务】① <具体可完成的小任务>；② <具体可完成的小任务>；③ <具体可完成的小任务>。
      4. 【激励语】<1 句个性化正向鼓励>
      5. 【复习提醒】<按遗忘规律提醒该复习的内容>
