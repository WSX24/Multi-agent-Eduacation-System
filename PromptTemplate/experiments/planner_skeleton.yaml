name: planner_skeleton
label: 规划·骨架示例（结构具体，内容为占位符）
# 与 teacher_sprint 同样的设计：数量与结构具体（真列 2 章、章课时=单元之和、
# 每个单元都带 homework 与 lesson_status），内容全部为占位符。
examples:
  - input: |
      学科：<学科>
      学习目标：<一句话说明要掌握什么>
      总周期：<N周>
      每周可投入时间：<N课时>
      学生水平：<入门/基础/中等/进阶/竞赛>
    output: |
      【学习总览】<N 周后你能达到什么水平>。
      【阶段地图】第1章 <章名>（<n>个单元 + 1次测验）→ 第2章 <章名>（<n>个单元 + 1次测验）
      【时间安排】第1章：第1-2周，约3课时；第2章：第3-4周，约3课时。全周期预留约<弹性>课时弹性，用于章节测验讲评和错题回炉。
      【解锁规则】每章学完并通过章节测验（<分数线>分以上），下一章才会开启。
      【给你的话】<1 句针对该学生水平的学习建议>。

      course:
        subject: <学科>
        goal: <一句话总目标>
        student_level: <学生水平>
        total_weeks: <整数>
        weekly_hours: <整数>
        mode: long_term
        buffer_ratio: 0.15
        net_hour_budget: <容量 × 0.85，向下取整到 0.5>

      chapters:
        - id: ch01
          order: 1
          title: <第一章章名>
          estimated_hours: 3
          unlock:
            type: none
          units:
            - id: ch01-u1
              title: <单元名>
              type: 新授
              estimated_hours: 1.5
              homework:
                count: 4
                difficulty: <基础>
              lesson_status: pending
            - id: ch01-u2
              title: <单元名>
              type: 新授
              estimated_hours: 1.5
              homework:
                count: 4
                difficulty: <基础>
              lesson_status: pending
          assessment:
            type: chapter_test
            difficulty: <基础>
            covers: [ch01-u1, ch01-u2]
            unlock_next:
              min_score: 60

        - id: ch02
          order: 2
          title: <第二章章名>
          estimated_hours: 3
          unlock:
            type: after_chapter
            chapter: ch01
            min_score: 60
          units:
            - id: ch02-u1
              title: <单元名>
              type: 新授
              estimated_hours: 1.5
              homework:
                count: 4
                difficulty: <基础>
              lesson_status: pending
            - id: ch02-u2
              title: <单元名>
              type: 新授
              estimated_hours: 1.5
              homework:
                count: 4
                difficulty: <基础>
              lesson_status: pending
          assessment:
            type: chapter_test
            difficulty: <基础>
            covers: [ch02-u1, ch02-u2]
            unlock_next:
              min_score: 60
