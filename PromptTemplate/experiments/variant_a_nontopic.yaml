name: variant_a_nontopic
label: 变体A·非学科示例（结构具体，主题无人会问）
# 设计意图：保留「具体」（真的列用时、真的 2-3 题、真的 5 道测验），
# 但把主题换成学习类产品里没人会来请求的技能，从概率上消除同题撞车。
examples:
  - input: |
      主题：3天学会盲拧三阶魔方
      可用时限：3天
      起点水平：零基础
    output: |
      【速成目标】3 天内你能在闭眼的情况下复原三阶魔方，应付常见的打乱情况。
      主动舍弃：单手拧、脚拧、最少步优化——3 天里性价比太低。

      【学习路径】
      | 序号 | 里程碑 | 用时 | 学什么 | 练什么 |
      |---|---|---|---|---|
      | M1 | 记住配色与手位 | 1.5小时 | 标准配色顺序、每面朝向、手指怎么搭 | 3 次蒙眼摸块报位置 |
      | M2 | 分段记忆编码 | 3小时 | 把棱块与角块各编成一组好记的词 | 4 次现场编词 |
      | M3 | 盲拧全流程 | 4.5小时 | 先看后拧、边拧边回忆、卡住怎么救 | 4 次完整盲拧 |

      【核心讲解】
      M1 记住配色与手位：先把标准配色背成一句话，再练到手指摸到任意一块就能报出它的位置。
      M2 分段记忆编码：不要一次记二十块，把棱块和角块分成两组，各串成一句顺口的话。
      M3 盲拧全流程：先整体看一遍并编成码，再闭眼按编码逐步拧；卡住时停手回忆，不要乱拧。
      提醒一句：记不住就先回去练 M2，别急着闭眼。

      【随堂练习】
      M1-1 标准配色里，白色对面是什么颜色？
      【答案】黄色。【要点】配对记比单个记牢。
      M1-2 摸到一块有两个面，怎么快速判断它属于哪个位置？
      【答案】按两面颜色的相对顺序判断。【要点】顺序判断反了位置就错。
      M1-3 打乱后先看哪一部分比较好？
      【答案】先看底面的十字。【要点】从最熟悉的结构入手。
      M2-1 棱块有十二个，一次全记不下来怎么办？
      【答案】分成两组各六个，各串一句话。【要点】分组降低记忆负担。
      M2-2 编码里出现不好记的词，可以换吗？
      【答案】可以，换成自己顺口的。【要点】编码只服务记忆，不要求标准。
      M2-3 角块和棱块的编码顺序能混着记吗？
      【答案】不要混，分开记完再合并。【要点】混记容易串位。
      M3-1 拧到一半发现记不清了怎么办？
      【答案】停手回想上一步的状态，不要继续乱拧。【要点】乱拧会彻底丢掉线索。
      M3-2 第一次盲拧应该给自己设时限吗？
      【答案】不设，先求复原成功。【要点】速度等熟练之后再练。
      M3-3 盲拧失败最常见的原因是什么？
      【答案】编码阶段就把某块的位置记错了。【要点】编码错一步，后面全错。

      【结束测验】
      1. 说出标准配色的三组对面颜色。
      【答案】白黄、红橙、蓝绿。【解析】配对记忆比单独记更牢。
      2. 棱块编码为什么要分组？
      【答案】一次记十二个超出短时记忆容量。【解析】分组把负担降到能记住的量。
      3. 盲拧前的观察时间应该用来做什么？
      【答案】把全部块的位置编成码。【解析】观察就是编码，不是随便看看。
      4. 拧到中途卡住，正确的处理是什么？
      【答案】停下回忆当前状态，不要乱拧。【解析】乱拧会丢失线索。
      5. 复盘一次失败的盲拧，应该先看什么？
      【答案】先看是编码错还是执行错。【解析】定位到阶段才能针对性练。
      【自评标准】五题里对四题以上，说明流程已通；错在编码就回头练 M2。

      【时间提醒】进度落后时优先保住 M2——编码记不住，后面全靠碰运气。
