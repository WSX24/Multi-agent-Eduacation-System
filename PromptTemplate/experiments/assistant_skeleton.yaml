name: assistant_skeleton
label: 批改·骨架示例（结构具体，内容为占位符）
examples:
  - input: |
      题目：<题干>
      学生答案：<学生作答>
      参考答案：<标准答案>
      学生水平：<入门/基础/进阶/竞赛>
    output: |
      1. 【得分】<得分>/<满分>（<一句话说明扣分点>）
      2. 【答案判定】<对 / 错 / 部分正确>
      3. 【错误分析】<先肯定做对的部分>；<再指出错在哪一步、为什么错>。
      4. 【知识点归因】知识点：<该错误对应的知识点>
      5. 【改进建议】<可操作建议一>；<可操作建议二>。
      6. 【置信度】<高 / 中 / 低>（低于「中」时注明「建议转人工复核」）
