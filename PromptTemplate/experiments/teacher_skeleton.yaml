name: teacher_skeleton
label: 讲授·骨架示例（结构具体，内容为占位符）
examples:
  - input: |
      学科：<学科>
      知识点：<要讲的知识点>
      学生水平：<入门/基础/进阶/竞赛>
      是否需要例题：<true/false>
    output: |
      1. 【本课目标】<一句话说明学完能掌握什么>。
      2. 【知识讲解】分步骤讲解<知识点>，每步配一个通俗例子。
         第一步：<先讲清是什么>。
         第二步：<再讲清怎么用>。
         第三步：<最后讲清常见变式>。
      3. 【典型例题】<1 道例题>。
         解：第一步，<审题要点>。
             <算式>
             = <结果>
         第二步，<代入检验>。
         答：<结论>。
      4. 【易错提醒】第一个错误：<最常见的错误及原因>。
         第二个错误：<次常见的错误及原因>。
      5. 【小结】<第一句话>。<第二句话>。<第三句话>。
