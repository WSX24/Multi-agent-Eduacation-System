<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>cta frame</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}iframe{border:0;display:block;position:absolute;left:0;top:0}</style>
</head>
<body>
<!-- 截 landing.html 尾部用。不直接用 #cta 锚点：锚点在解析时就跳了，
     而 --film-h（320vh）是 deferred 脚本之后才写的，页面一变高锚点就跑位，
     截出来是一片白。也正因为整页高度依赖 vh，不能用「高视口截全页」的办法。
     所以：iframe 给真实视口尺寸（vh 才对），加载完再把里面滚到底。 -->
<iframe id="f" src="../landing.html?grow=1"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = +(q.get('w') || 1440), h = +(q.get('h') || 900);
var f = document.getElementById('f');
f.width = w; f.height = h;
f.onload = function () {
  var d = f.contentDocument;
  function toBottom() { f.contentWindow.scrollTo(0, d.documentElement.scrollHeight); }
  d.fonts.ready.then(function () { toBottom(); setTimeout(toBottom, 260); setTimeout(function(){ document.title = 'DONE'; }, 600); });
};
</script>
</body></html>
