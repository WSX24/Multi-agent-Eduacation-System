# ═══════════════════════════════════════════════════════════════════════
# Concept Contract — 智塾 landing.html 首屏「一线」滚动一镜到底
#
# 事实源 #1。本文件只保存「用户明确要求的对象、视觉、交互和连续性」。
#
# 沿革：
#   2026-09-25  A+C：站立机器人起跳落地长镜头          → 已作废
#   2026-09-26  方向 2：无限尺度穿透，白纸教室 + 4 段视频 → 已作废
#   2026-09-26  「一线」：一条自己生长的墨线            ← 本版，用户确认
#
# 用户在 2026-09-26 的两次表态锁定了本版：
#   1.「未必要使用这个机器人，看看能不能使用一个连贯的动画」
#   2.「手感还不错，这条路线的画面可以丰富点」
#
# 关键帧、片段与生产计划在 source/motion-brief.yaml。
# 世界（纸与墨）的可验证锚点在 source/scene-bible.md。
# ═══════════════════════════════════════════════════════════════════════

subject_count: 1

subjects:
  - identity: >-
      **一条自己生长的墨线的前端。** 全片唯一的运动主体，也是唯一的视觉锚点。
      它不是角色、不是道具、没有身份可言——只有路径与笔宽。这是本版与前三版
      最根本的差别，也是它能在结构上避开前三版全部失败模式的原因（见下方
      「为什么换成一条线」）。
      素材：不需要生成的动画媒体。线由程序按 source/motion-brief.yaml 的
      路径数据绘制，宽度由笔宽曲线决定。

style: >-
  由导出设计锁定，非用户新指定词。来源 css/tokens.css（**白底主题**，
  2026-09-25 由用户从深色改为白色并放弃双主题方案）：
  画布 --bg #ffffff 纯白、正文 --fg #0f0f10 近黑、--muted #5c5c5e、
  边界 --border #e6e6e8；强调色 --accent **#9333ea**，--accent-hover #a855f7。
  与 DESIGN-HANDOFF.md「Treat this handoff as a visual contract」。
  画面风格见 source/scene-bible.md：**纸上的一笔画**。白纸为底，灰墨为线，
  紫色是唯一的彩色。手绘感来自笔宽曲线与墨坐在纸上的接触阴影，
  **不来自滤镜**（v3 用位移/遮罩滤镜做毛边，把线撕成碎片，已删）。
  严禁改造为写实 CGI、赛博霓虹、发光细线堆砌、电路纹理或塑料 AI 噪点。

motion_intent: >-
  一次连续推轨 + 一条连续笔画。摄影机跟着笔尖走，沿一张白纸从全景推进到
  纸的内部，再拉远收束，把整幅一笔画收进画面。笔画在同一时间线上依次画出：
  透视房间 → 左墙的窗 → 左排三张课桌 → 右排三张课桌 → 右墙的三层书架
  → 讲台 → 讲台上摊开的书 → 从书页落下的墨迹河道 → 四道工序 → 收笔回环。
  视觉结果：用户往下滚的时候是**自己在摇一台轨道车**，同时也是**自己在落笔**。
  反向滚动必须是同一次推轨与同一次落笔的倒放。

driver: scroll

input_semantics: continuous
# 滚轮位置直接映射到「已画长度」与「摄影机位置」，不是「滚一下触发一次」。
# 输入停止时画面停在当前位置，不回弹、不续播。

time_control: scrub
# 逐帧随动定位。禁止出现「滚一下然后自动跑完」的段播行为。

navigation: continuous
# 首屏之后的页面是连续长页（#agents / #loop / #cta），不是分页。
# 页面如何移动不决定媒体如何播放。

background_owner: page
# 语义说明（本版与前两版的差别，必须写清，因为它决定了整个交付形态）：
#   · 前两版是 video：背景与主体一起烘焙进生成的媒体里。
#   · 本版是 page：**背景属于页面**——它是一张生成的纸材质贴图
#     （source/paper-texture-graded.png），由页面无限平铺、随摄影机变换。
#     主体（墨线）由程序绘制，**不含任何背景**，因此"透明复用"这一条
#     按构造成立：它根本没有背景可以抠。
#   · 因此本片不产生任何动画媒体：不抠色、不要色键、不要 alpha 视频、
#     不要图集。这是本版最大的成本优势，也是它避开接缝问题的物理原因。
#
# 交付预算的适用性（见 source/motion-brief.yaml 的 delivery_budget）：
#   build/motion-budget.json 不存在，而且不应该存在。motion_budget.py 是在
#   「有动画媒体」的前提下选择 alpha-atlas / chroma-video / baked-video；
#   本路线没有任何动画媒体，三个选项都没有对象。旧报告已随方向 2 作废，
#   移到 qa/archive-direction2/motion-budget.json。
#   只有在用户选择加入「墨渗进纸纤维」那一段生成素材时，预算才有对象——
#   届时它是 background_owner=video 的短片段，按 baked-video 单独预算。

scene: >-
  见 source/scene-bible.md。一句话：**一张白纸，和落在它上面的一条墨线。**
  纸是唯一的背景，它有纤维、折痕、近似网格的极淡稿线；墨坐在纸上，
  与纸有接触阴影；紫色只在河道那一段出现，是全片唯一的彩色。

# ── 为什么换成一条线（本版的核心论证） ────────────────────────────────
# 前三版的失败模式全部来自同一件事：**某个主体必须跨越多段/多尺度保持一致。**
# 参考图会牵引色调与构图（三次 K0 尝试里，暖褐与中轴偏右都只在参考图在场时
# 出现）；角色身份会漂移；五级尺度要各锁一套风格。
#
# 一条自己生长的墨线把这件事从"靠约束压制"变成"结构上不存在"：
#
#   中轴偏右（方向 2 三次都栽） → **自锚定**：锚点由笔尖位置定义，
#                                 不需要逐帧维持一个固定构图。
#   跨尺度风格漂移             → **自相似**：线在五个尺度上都是线。
#                                 放大只是把同一个形状看得更近。
#   身份漂移                    → **无身份**：没有脸、没有部件、没有道具。
#   不可逆（旧版起跳落地）       → **可逆**：笔画往回走就是擦除，
#                                 推轨往回走就是拉远。两者物理上都成立。
#   多段接缝                    → **无接缝**：全片只有一条 path，
#                                 接缝问题按构造不存在。
#   参考图拖色偏                → 不需要参考图。
#
# 代价（诚实记账）：观感是"极漂亮的线描动画"，不是电影。
# 没有景深、没有体积光、没有实拍材质。补救选项是那一段可选生成素材。

continuity:
  - 单一笔画：任何时刻画面上只有**一条**墨线。不得出现分叉、并列、
    断口或多个笔尖。笔宽可以变化，但必须是同一条连续轮廓带。
    （v3 曾把变宽度做成 22 个宽度桶各一条 path，视觉上是一条线被切成
      几十段彼此错开的短线，被用户判为「同时有几条线」。已改为单一闭合
      轮廓带，见 motion-brief 的 ribbon 说明。）
  - 路径不变：线的形状是固定的路径数据。滚动只改变"已画到哪里"，
    不改变已经画过的形状——否则反向回放会出现形变，可逆性即失效。
  - 材料恒定：纸（白、纤维、折痕、极淡稿线）、墨（灰黑 #2a2a2e）、
    紫（#a855f7，唯一彩色）。不得出现第二种彩色。
  - 紫色纪律：紫色只出现在河道那一段（路径后 34%），面积 ≤8%。
  - 光位恒定：纸上有缓慢移动的柔光斑（视差层，走得比纸慢）。
    时间维度上不得出现亮度闪烁或色温漂移。
  - 深度方向恒定：全程只有向前推进与向后拉远，以及沿纸面的平移。
    没有横向环绕、没有换轴。
  - 摄影机锚点由笔尖位置定义，前段偏向纸心 25%，末段（80% 之后）
    过渡到纸心。锚点函数是运动的函数，不是需要维护的常量。
  - 页面背景、字标、CTA、进度条全部在媒体层之外；
    画面里不得出现任何可读文字、数字、UI 或水印。
  - 纸的材质必须来自已调色的材质板（tools/grade_plate.py），
    不得在页面里用 CSS filter 临时凑亮度。

aspect_ratio: custom
# **本版的画幅由宿主视口决定，不存在固定的媒体画幅。**
# 原因：画面是「程序绘制的矢量线 + 无限平铺的纸贴图」，两者都随视口自适应。
# 所以技能里那条「桌面全屏必须 16:9、移动端必须 9:16」的规则对本版不适用——
# 那条规则约束的是**生成的位图/视频**，它们一旦生成就固化了画幅。
# 本版没有这样的资产，因此：
#   · 桌面与移动端跑同一套代码、同一份材质，不需要两套媒体；
#   · 前两版的「移动端 9:16 是已知缺口」在本版**自动消失**。
# 这是本路线相对前两版的一个实质优势，不是妥协。
# 唯一的固定画幅资产是纸材质板（1152×864，4:3），但它是平铺材质，
# 其长宽比不约束构图。

destination: >-
  landing.html 首屏 section#film。全屏铺满（100vw × 100vh），
  sticky pin 住舞台，滚动行程映射到进度。桌面与移动端同一实现；
  prefers-reduced-motion 走静态降级。

