<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>wrap-probe-live</title>
<style>
  body { margin: 0; font: 12px/1.6 monospace; }
  #out { white-space: pre; padding: 12px; }
  iframe { border: 0; position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<pre id="out">pending</pre>
<iframe id="L390" src="../landing.html" width="390" height="844"></iframe>
<iframe id="L768" src="../landing.html" width="768" height="1024"></iframe>
<iframe id="L1440" src="../landing.html" width="1440" height="900"></iframe>
<iframe id="I390" src="../index.html" width="390" height="844"></iframe>
<iframe id="I1440" src="../index.html" width="1440" height="900"></iframe>

<script>
// 直接在真实页面的 iframe 里量，避免探针自己重排带来的偏差。
// 跨多个文本节点（.nb span 把第一个分句切出去了）逐字测 top，top 变了就是断行点。
function lineBreak(doc, el) {
  var nodes = [], w = doc.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) nodes.push(w.currentNode);
  var lines = [], cur = '', lastTop = null;
  nodes.forEach(function (t) {
    for (var i = 0; i < t.length; i++) {
      var r = doc.createRange();
      r.setStart(t, i); r.setEnd(t, i + 1);
      var rect = r.getClientRects()[0];
      if (!rect) { cur += t.data[i]; continue; }
      var top = Math.round(rect.top);
      if (lastTop === null || top === lastTop) cur += t.data[i];
      else { lines.push(cur); cur = t.data[i]; }
      lastTop = top;
    }
  });
  if (cur) lines.push(cur);
  return lines;
}

var SEL = ['.land-section h2', '.land-cta h2', '.idx-hero h1'];
var frames = ['L390', 'L768', 'L1440', 'I390', 'I1440'];
var out = [], pending = frames.length;

frames.forEach(function (id) {
  var f = document.getElementById(id);
  f.onload = function () {
    var doc = f.contentDocument;
    doc.fonts.ready.then(function () {
      setTimeout(function () {
        out.push('=== ' + f.getAttribute('src').replace('../', '') + '  @ ' + f.width + 'px ===');
        SEL.forEach(function (s) {
          Array.prototype.forEach.call(doc.querySelectorAll(s), function (h) {
            var lines = lineBreak(doc, h);
            var cs = doc.defaultView.getComputedStyle(h);
            out.push('  h: ' + h.textContent + '   [' + cs.fontSize + ' / max-width ' + cs.maxWidth + ']');
            lines.forEach(function (l, i) {
              out.push('     line' + (i + 1) + ' (' + Array.from(l).length + '): ' + l);
            });
          });
        });
        out.push('');
        if (--pending === 0) document.getElementById('out').textContent = out.join('\n');
      }, 400);
    });
  };
});
</script>
</body>
</html>
