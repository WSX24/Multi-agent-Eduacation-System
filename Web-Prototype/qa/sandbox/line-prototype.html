<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>「一线」草稿台 — 无页面装饰的宿主</title>
<!-- ═══════════════════════════════════════════════════════════════════
     这个文件**不实现任何渲染逻辑**。它加载与 landing.html 相同的运行时
     （build/line-runtime-data.js 与 js/line-runtime.js），只是把页面的
     字标、CTA、顶栏、下一节全部去掉，用来单独判线稿与纸面。

     之所以这样改：早先的版本自己实现了一遍轮廓带 / 相机 / 纸层，于是同一套
     算法有了两处定义 —— 改一处忘一处。现在几何只在运行时里有一份。

     用法：
       ?p=0.62      钉在指定进度看画面
       ?hud=1       显示数值面板
       ?diag=1      输出速度诊断表（相机平移 / 笔尖画面 / 已画增量 / 重描）
       ?under=full  叠上整份铅笔底稿

     驱动脚本在 driver.js —— 独立成文件是因为内联时那些换行转义在命令传递中
     被吃过两次，每次都让字符串里出现真实换行从而导致语法错误。
     ═══════════════════════════════════════════════════════════════════ -->
<!-- 加载与 landing.html 相同的令牌与基础样式。
     不加载它会掩盖页面级 CSS 问题：曾经 base.css 的全局
     `img, svg { max-width: 100% }` 把墨层的坐标系压变形，而草稿台不加载它，
     于是两边画出来的东西不一样 —— 这个 bug 就是这样才被发现的。 -->
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<style>
  :root { --rule: rgba(42,42,46,.034); --ink-color: #2a2a2e; --violet: #a855f7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #faf8f4; }
  .film { position: relative; height: 100vh; }
  .film-pin { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #faf8f4; }
  .paper {
    position: absolute; inset: 0; z-index: 1; background-repeat: repeat;
    will-change: background-size, background-position, opacity;
  }
  .paper--fiber {
    background-image:
      url("../../source/paper-fiber.png"),
      repeating-linear-gradient(to right,  var(--rule) 0 1px, transparent 1px 100%),
      repeating-linear-gradient(to bottom, var(--rule) 0 1px, transparent 1px 100%);
  }
  .paper--macro { background-image: url("../../source/paper-texture-graded.png"); }
  .ink { position: absolute; top: 0; left: 0; z-index: 2; overflow: visible;
         transform-origin: 0 0; will-change: transform; max-width: none; }
  .ribbon--under { fill: #8a8a90; }
  .ribbon--ink   { fill: var(--ink-color); filter: drop-shadow(0 0.9px 1.1px rgba(42,42,46,.30)); }
  .ribbon--glow  { fill: var(--violet); filter: drop-shadow(0 0 5px rgba(168,85,247,.45)); }

  .hud, .diag {
    position: fixed; z-index: 9; font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace;
    color: #5c5c5e; background: rgba(255,255,255,.86);
    border: 1px solid #e6e6e8; border-radius: 8px; padding: 8px 12px;
    white-space: pre; display: none;
  }
  .hud { left: 14px; bottom: 14px; }
  .diag { left: 14px; top: 14px; max-height: 92vh; overflow: auto; }
  body.hud-on .hud { display: block; }
  body.diag-on .diag { display: block; }
  .fatal {
    position: fixed; inset: auto 16px 16px 16px; z-index: 20; display: none;
    font: 13px/1.7 ui-monospace, monospace; white-space: pre-wrap;
    color: #7e22ce; background: #faf5ff; border: 1px solid #e9d5ff;
    border-radius: 10px; padding: 12px 16px;
  }
  body.fatal-on .fatal { display: block; }
</style>
</head>
<body>

<div class="film" id="film">
  <div class="film-pin" id="filmPin">
    <div class="paper paper--macro" id="pMacro"></div>
    <div class="paper paper--fiber" id="pFiber"></div>
    <svg class="ink" id="ink" aria-hidden="true">
      <path class="ribbon ribbon--under" id="rUnder"></path>
      <path class="ribbon ribbon--ink" id="rInk"></path>
      <path class="ribbon ribbon--glow" id="rGlow"></path>
    </svg>
  </div>
</div>
<div class="hud" id="hud"></div>
<pre class="diag" id="diag"></pre>
<div class="fatal" id="fatal"></div>

<!-- 与 landing.html 完全相同的两个文件。这里没有第二份渲染实现。 -->
<script src="../../build/line-runtime-data.js"></script>
<script src="../../js/line-runtime.js"></script>
<script src="driver.js"></script>
</body>
</html>
