<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>auth geometry</title>
<style>html,body{margin:0;font:12px/1.6 monospace}#out{white-space:pre;padding:12px}iframe{border:0;position:absolute;left:-9999px;top:0}</style>
</head>
<body>
<!-- 换图之后要确认三件事：图确实加载了（file:// 相对路径）、
     整列没被顶高到出滚动条、横向没溢出。 -->
<pre id="out">pending</pre>
<script>
var CASES = [[1440,900],[1366,768],[1920,1080],[1280,800],[1024,768],[900,700],[820,1180],[390,844]];
var out = [], pending = CASES.length;
CASES.forEach(function (c) {
  var f = document.createElement('iframe');
  f.width = c[0]; f.height = c[1]; f.src = '../auth.html';
  f.onload = function () {
    var d = f.contentDocument;
    d.fonts.ready.then(function () {
      setTimeout(function () {
        var img = d.querySelector('.auth-mini img'), de = d.documentElement;
        var r = img.getBoundingClientRect();
        var mini = d.querySelector('.auth-mini');
        var style = f.contentWindow.getComputedStyle(mini);
        out.push('=== ' + c[0] + '×' + c[1] + ' ===');
        out.push('  图: natural ' + img.naturalWidth + '×' + img.naturalHeight +
                 '   渲染 ' + r.width.toFixed(0) + '×' + r.height.toFixed(0) +
                 '   (naturalWidth>0 = 加载成功' + (img.naturalWidth > 0 ? ' ✓)' : ' ✗ 没加载到!)'));
        out.push('  .auth-mini display=' + style.display +
                 '   文档高=' + de.scrollHeight + '  视口高=' + c[1] +
                 (de.scrollHeight > c[1] + 1 ? '   ← 出滚动条（高 ' + (de.scrollHeight - c[1]) + 'px）' : '   ← 不滚动 ✓'));
        out.push('  横向 scrollWidth=' + de.scrollWidth + ' clientWidth=' + de.clientWidth +
                 (de.scrollWidth > de.clientWidth + 1 ? '  ← 溢出!' : '  ok'));
        out.push('  左栏底部（页脚字标）底=' + d.querySelector('.auth-foot').getBoundingClientRect().bottom.toFixed(0) +
                 '   机器人底=' + r.bottom.toFixed(0));
        out.push('');
        if (--pending === 0) document.getElementById('out').textContent = out.join('\n');
        f.remove();
      }, 500);
    });
  };
  document.body.appendChild(f);
});
</script>
</body></html>
