<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>landing 布局探针</title>
<style>body{font:12px/1.5 ui-monospace,Consolas,monospace;margin:0} iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0}
pre{position:absolute;left:0;top:906px;width:1600px}</style>
</head>
<body>
<pre id="out">loading…</pre>
<iframe id="f" src="../landing.html"></iframe>
<script>
/* 为什么需要这个探针：
   landing.js 的几何全部读自 #anchorA / #anchorB 的 offsetLeft/offsetTop，
   而「机器人是否站在地平线上」只取决于 anchorA 的底边与 #filmFloor 的顶边
   是否重合。这个关系是纯布局，读屏幕像素只能估；直接在页面里读 rect 才能
   拿到确定值。探针只读，不写，也不改 landing.html 的任何东西。 */
var out = document.getElementById('out');
var f = document.getElementById('f');
f.addEventListener('load', function () {
  setTimeout(function () {
    try {
      var d = f.contentDocument, w = f.contentWindow;
      function g(id) {
        var e = d.getElementById(id); if (!e) return id + ': 缺失';
        var r = e.getBoundingClientRect();
        return id + ': x ' + r.left.toFixed(1) + '..' + r.right.toFixed(1) +
               '  y ' + r.top.toFixed(1) + '..' + r.bottom.toFixed(1) +
               '  (w ' + r.width.toFixed(1) + ' h ' + r.height.toFixed(1) + ')';
      }
      var land = d.querySelector('.landing');
      var lcs = w.getComputedStyle(land);
      var rig = d.getElementById('robotRig');
      var film = w.OilMotionFilm || {};
      var lines = [
        'viewport          ' + w.innerWidth + 'x' + w.innerHeight,
        '--floor-y         ' + lcs.getPropertyValue('--floor-y').trim(),
        '--rig-a-w         ' + lcs.getPropertyValue('--rig-a-w').trim(),
        '--rig-b-w         ' + lcs.getPropertyValue('--rig-b-w').trim(),
        '--rig-b-x         ' + lcs.getPropertyValue('--rig-b-x').trim(),
        '--rig-foot        ' + lcs.getPropertyValue('--rig-foot').trim(),
        '--rig-ar          ' + lcs.getPropertyValue('--rig-ar').trim(),
        '',
        g('anchorA'), g('anchorB'), g('filmFloor'), g('robotRig'), g('rigPortrait'),
        '',
        'rig transform     ' + (rig ? rig.style.transform : '—'),
        'html[data-film]   ' + d.documentElement.dataset.film,
        'media ready       ' + film.ready + '   failed ' + film.failed,
        '媒体层 is-media   ' + !!(d.getElementById('rigPortrait') || {}).className,
        '',
        '脚底(= anchorA 底边) y ' + d.getElementById('anchorA').getBoundingClientRect().bottom.toFixed(1) +
          '   地平线 y ' + d.getElementById('filmFloor').getBoundingClientRect().top.toFixed(1) +
          '   差 ' + (d.getElementById('anchorA').getBoundingClientRect().bottom -
                    d.getElementById('filmFloor').getBoundingClientRect().top).toFixed(1) + 'px',
        '落点(= anchorB 底边) y ' + d.getElementById('anchorB').getBoundingClientRect().bottom.toFixed(1) +
          '   与地平线差 ' + (d.getElementById('anchorB').getBoundingClientRect().bottom -
                    d.getElementById('filmFloor').getBoundingClientRect().top).toFixed(1) + 'px',
      ];
      out.textContent = lines.join('\n');
    } catch (e) {
      out.textContent = 'ERR ' + e;
    }
  }, 1500);
});
</script>
</body>
</html>
