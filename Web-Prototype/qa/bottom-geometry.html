<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>bottom geometry</title>
<style>html,body{margin:0;font:12px/1.6 monospace}#out{white-space:pre;padding:12px}iframe{border:0;position:absolute;left:-9999px;top:0}</style>
</head>
<body>
<!-- 量「整个图案从网页底部开始」这件事有没有真做到，以及落花会不会压到标题/按钮。
     用 ?grow=1（不过它不影响几何）。 -->
<pre id="out">pending</pre>
<script>
var CASES = [[1440,900],[1920,1080],[1280,800],[1024,768],[820,1180],[600,960],[390,844],[360,800]];
var out = [], pending = CASES.length;
CASES.forEach(function (c) {
  var f = document.createElement('iframe');
  f.width = c[0]; f.height = c[1]; f.src = '../landing.html?grow=1';
  f.onload = function () {
    var d = f.contentDocument;
    d.fonts.ready.then(function () {
      setTimeout(function () {
        var q = function (s) { return d.querySelector(s); };
        var R = function (el) { var b = el.getBoundingClientRect(); return {t: b.top, b: b.bottom, l: b.left, r: b.right, w: b.width, h: b.height}; };
        var de = d.documentElement;
        var bot = R(q('.botany')), row = R(q('.land-cta .row'));
        var lane = R(q('.petal-fall'));
        var petals = [].slice.call(d.querySelectorAll('.petal')).map(function (p) { return R(p); });
        var svg = q('.botany-ink'), bb = svg.getBBox(), vb = svg.viewBox.baseVal;
        var sc = Math.max(bot.w / vb.width, bot.h / vb.height);
        var inkTop = bot.b - (vb.height - bb.y) * sc;
        out.push('=== ' + c[0] + '×' + c[1] + ' ===');
        out.push('  文档高=' + de.scrollHeight + '  文档底=' + (de.scrollTop + c[1]) +
                 '  草块底=' + bot.b.toFixed(0) +
                 (Math.abs(bot.b - de.scrollHeight) < 1.5 ? '   ← 草根=文档底边 ✓' : '   ← 底部还有 ' + (de.scrollHeight - bot.b).toFixed(0) + 'px 空隙 ✗'));
        out.push('  草带高=' + bot.h.toFixed(0) + '（缩放 ' + sc.toFixed(3) + '）  墨水顶=' + inkTop.toFixed(0) +
                 '  按钮行底=' + row.b.toFixed(0) + '  净空=' + (inkTop - row.b).toFixed(0) + 'px');
        // 花瓣通道现在是故意铺满一屏的：落花可以穿过标题与按钮（这是设计要求）。
        var above = petals.filter(function (r) { return r.t < row.t; }).length;
        out.push('  落花通道顶=' + lane.t.toFixed(0) + '（高 ' + lane.h.toFixed(0) + '，覆盖 ' +
                 (lane.h / c[1] * 100).toFixed(0) + '% 视口）  当前在视口内的花瓣=' +
                 petals.filter(function (r) { return r.b > 0 && r.t < c[1]; }).length + '/9' +
                 '（其中 ' + above + ' 片在按钮行以上 —— 故意的，要的就是「从空中落下」）');
        out.push('  CTA 底=' + R(q('.land-cta')).b.toFixed(0) + '  草块顶=' + bot.t.toFixed(0) +
                 '（差 ' + (bot.t - R(q('.land-cta')).b).toFixed(0) + 'px）  横向溢出:' +
                 (de.scrollWidth > de.clientWidth + 1 ? ' 有 ✗' : ' 无 ✓'));
        out.push('');
        if (--pending === 0) document.getElementById('out').textContent = out.join('\n');
        f.remove();
      }, 420);
    });
  };
  document.body.appendChild(f);
});
</script>
</body></html>
