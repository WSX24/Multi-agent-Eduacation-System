# ═══════════════════════════════════════════════════════════════════════
#
# Concept Contract — 智塾 landing.html 首屏「一本书的光」滚动一镜到底
#
# 事实源 #1。本文件只保存「用户明确要求的对象、视觉、交互和连续性」。
#
# 沿革：
#   2026-09-25  站立机器人起跳落地长镜头                 → 作废
#   2026-09-26  方向 2：无限尺度穿透，白纸教室 + 4 段视频  → 作废
#   2026-09-26  「一线」：一条自己生长的墨线             → 作废
#   2026-09-26  「书架之光」：书架 + 知识化作光芒 + 汇聚  → 作废（480p 守不住书脊）
#   2026-09-26  「一本书的光」                            ← 本版，用户确认
#
# 用户 2026-09-26 的指令原文：
#   1.「我想要的画面镜头：先有个书架，书架上的所有书的知识化作一道道光芒，
#      然后转场光芒汇聚到我们的智能体里。你先生成视频我看看。要求一镜到底」
#   2.「首先不能把水印留着，然后继续」
#   3.「这样子，你把提示词给我，我去给你生成视频」
#   4.「你直接用这个」  ← 指定 source/oneshot-book-light-v2.mp4 为镜头定稿
#
# 第 1 条被 480p 的模型能力否决（书脊是细密高频结构，5 秒内糊成一团，
# 实测结构相关 0.095）。经用户同意改成低信息密度的「一本书的光」，
# 保住原有的三个节拍：书 → 知识化作光 → 汇入智能体核心。
# 理由与实测见 source/scene-bible.md §1。
#
# 关键帧、片段与生产计划在 source/motion-brief.yaml。
# 世界（材料与光）的可验证判据在 source/scene-bible.md。
# ═══════════════════════════════════════════════════════════════════════

subject_count: 2

subjects:
  - identity: >-
      一本**摊开的大书**，平放在素色台面上，位于画面左下部，占画面约三分之一。
      米白 / 奶白的厚纸页，中间一道柔和折痕，页面上几行**细灰且不可读**的字迹。
      全片姿态不变：不合上、不翻页、不移动、不变形。
  - identity: >-
      一颗**深蓝灰哑光多面体**（智能体核心），约拳头大，悬在矮台座上方，
      位于画面右后方。切面清晰，中间一道细缝。开场不发光、不移动；
      结尾从内部透出淡紫白光，光晕紧贴表面、很短距离内消失。

style: >-
  由导出设计锁定，非用户新指定词。来源 css/tokens.css（**白底主题**：
  --bg #ffffff、--fg #0f0f10、--accent **#9333ea**，--accent-hover #a855f7）
  与 DESIGN-HANDOFF.md「Treat this handoff as a visual contract」。
  画面的实际画风见 source/scene-bible.md：现代动画长片的插画风格，
  柔和的体积光影，哑光材质，细节克制，留白充足，**高调明亮**。
  严禁写实 CGI、霓虹、赛博朋克、电路纹理、塑料 AI 噪点、满屏细碎发光线条。

motion_intent: >-
  一次连续推轨 + 光的连续旅程。镜头全程几乎不动，只有极缓的向前推近。
  书页上泛起微光 → 长成一团柔和的淡紫白光雾从书上升起 → 缓慢向右飘向核心 →
  收成一道较细的光带从核心左侧流入 → 核心的切面从内部亮起、中缝成为一条
  明亮细线、表面带出一圈克制的光晕。
  视觉结果：观众看到「书里的知识变成光，飞进那台机器把它点亮」这一件事，
  全程一个镜头、不加剪辑、不换机位。

driver: scroll

input_semantics: continuous
# 滚轮位置直接映射到成片时间轴位置，不是「滚一下触发一次」。
# 输入停止时画面停在当前位置，不回弹、不续播。

time_control: scrub
# 逐帧随动定位（runtime.controller = frame-scrub，见 build/motion-budget.json）。
# 片中的运动是「光升起并飘向核心」，倒放即为「光退回书本」，
# 物理上成立，所以 scrub 的双向都成立。

navigation: continuous
# 首屏之后的页面是连续长页（#agents / #loop / #cta），不是分页。

clip_continuity: chain
# 本片由两段生产片段串联而成（seg-01 光升起 / seg-02 汇入核心点亮），
# 但**交付前已编译为每个设备版本各自的一条主视频**，运行时不得逐段换 src。
# 生产期的链接力：seg-02 的 --first-frame 就是 seg-01 验收后的实际尾帧，
# 实测接缝平均差 2.5、差>40 的像素 0.00%。

background_owner: video
# 场景、环境光、台面接触与景深都烘焙在视频里。页面不抠色、不合成背景、
# 不加色键 Shader。因为画面背景是近白、页面也是白，媒体边界几乎不可见
# （见 destination 的显示策略）。

scene: >-
  见 source/scene-bible.md。一句话：一张近白略暖的素色台面，上面摊着一本米色的书，
  右后方悬浮着一颗深蓝灰的多面体；知识从书里化作一团柔和的光，飘过去把它点亮。
  没有房间、没有家具、没有书架、没有装饰。

# ── 为什么放弃「书架 + 一道道光芒」的原始描述 ──────────────────────────
# 不是执行失败，是这套生成参数守不住那个题材。同一服务、同一档位下：
#   一排书脊（细密高频结构）→ 5 秒后结构相关 **0.095**，糊成一团色块；
#   一本摊开的书（几块大形状）→ 构图守住，光的方向也守住。
# 480p 的小模型对细密结构没有保真能力。用户同意把信息密度降下来，
# 三个节拍（书 → 知识化作光 → 汇入智能体）一个不少。
# 见 source/scene-bible.md §1 与 qa/shelf-route-status.md。

# ── 另一个决定：光必须给「首帧 + 尾帧」双锚点 ──────────────────────────
# 只给首帧时，模型对终点没有任何约束。实测同一提示词、同一首帧：
#   只给首帧       → 紫色重心从 72.6% 漂到 56.7%（远离核心），面积涨到 9.26%
#   首帧 + 尾帧    → 紫色重心守在 70.8% – 75.5%（核心一侧），面积 ≤3.46%
# 所以每一段都用首尾帧双锚点。尾帧由图片编辑器在原图上只改光得到
# （文生图会重画整个场景：实测独立生成的关键帧之间结构相关只有 0.05）。

continuity:
  - 主体数量恒为 2：一本摊开的书、一颗多面体。不增不减、不复制、不出现第二颗核心。
  - 书的姿态全片不变：不合上、不翻页、不移动、不变形。
  - 多面体位置与大小不变；只在结尾从内部亮起。
  - 台面是唯一的背景：不出现房间、家具、书架、窗、地板线、装饰。
  - 紫色是唯一彩色；任一帧面积 ≤8%，且不得随时间单调膨胀成团。
  - 亮度恒定：不许变暗、偏色、暗角；不许模糊、重影、闪烁。
  - 镜头恒定：只有极缓向前推近，不许摇、移、变焦抽动、重新构图。
  - 画面里不得出现任何可读文字、数字、UI、水印。
  - 页面背景、字标、CTA、进度条全部在媒体层之外。

aspect_ratio: "16:9"
# 母版 1280×720 = 1.7778，精确 16:9。满幅 cover 在 16:9 视口不裁切；
# 其他比例的视口会裁掉上下或左右（cover 的必然结果，已记录）。

destination: >-
  landing.html 首屏 section#film，**满幅覆盖整个视口**
  （用户 2026-09-26 明确要求「网页里要全覆盖显示」）。
  实现：`.film-frame { position: absolute; inset: 0 }` +
  `object-fit: cover`，不留边、不加淡出层。
  验收方式：四边各 6% 的条带里，接近白（>245）的像素占比必须为 0
  —— 实测 0.00%（p=1.00 为 0.05%）。
  编码产物的目标仍是母版原生尺寸（见 build/motion-budget.json），
  **放大发生在浏览器里**，母版文件本身没有被放大。

